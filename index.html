<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계의 뒷면 — PART 1·2 : 멘지의 영역 & 오크의 영역</title>
<style>
:root{--panel:rgba(14,22,40,.93);--edge:#7fb7ff;--ink:#eaf2ff;--gold:#ffd77a;--mute:#9fb2d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04060b;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:960px;height:640px;flex:none;transform-origin:center center;background:#000;overflow:hidden;user-select:none}
#view{position:absolute;left:0;top:0;width:960px;height:640px;image-rendering:pixelated}
.hidden{display:none!important}
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:8px;box-shadow:0 0 0 2px #0a1224,0 6px 20px rgba(0,0,0,.5)}
#hud>*{position:absolute}
#hp{left:12px;top:12px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:14px}
#hp .lbl{color:#ff9c9c;font-weight:700}
.bar{width:150px;height:14px;background:#1a2438;border:2px solid #0a1224;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a8a,#dd4444);transition:width .3s}
#btns{left:12px;top:60px;display:flex;gap:6px;flex-wrap:wrap;width:380px}
button{font-family:inherit}
.hb{background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.hb:hover{background:#243a64}
.hb kbd{background:#2b4170;border-radius:3px;padding:0 4px;font-size:11px;margin-left:2px}
#loc{left:50%;top:12px;transform:translateX(-50%);padding:5px 16px;font-size:14px;white-space:nowrap}
#quest{right:12px;top:12px;width:300px;padding:8px 12px;font-size:13px;line-height:1.5}
#quest h4{margin:0 0 3px;font-size:12px;color:var(--gold);letter-spacing:.5px}
#quest .mt{font-weight:700;font-size:14px}
#quest .ms{color:#cfe0ff}
#quest .sd{margin-top:5px;padding-top:5px;border-top:1px dashed #3b5385;font-size:12px;color:var(--mute)}
#toasts{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:20}
.toast{background:rgba(10,18,36,.92);border:2px solid var(--edge);border-radius:20px;padding:5px 16px;font-size:14px;animation:tin .25s,tout .5s 2.6s forwards;white-space:nowrap}
.toast.item{border-color:#7dffb0}.toast.quest{border-color:var(--gold);color:var(--gold)}.toast.done{border-color:#ff9fe0;color:#ffc9ef}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#prompt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:6px 18px;font-size:15px;white-space:nowrap;pointer-events:none}
#prompt b{background:#2b4170;border:1px solid var(--edge);border-radius:4px;padding:0 7px;margin-right:6px;color:var(--gold)}
#dialog{position:absolute;left:40px;right:40px;bottom:20px;min-height:148px;padding:16px 22px 14px;cursor:pointer;z-index:30}
#dName{position:absolute;left:18px;top:-17px;background:#2b4170;border:3px solid var(--edge);border-radius:6px;padding:2px 16px;font-size:16px;font-weight:700;color:var(--gold)}
#dText{font-size:20px;line-height:1.6;min-height:64px;white-space:pre-wrap;margin-top:4px}
#dText.nar{font-style:italic;color:#cfe3ff}
#dNext{position:absolute;right:18px;bottom:8px;font-size:13px;color:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#dChoices{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#dChoices button{text-align:left;background:#1d3059;color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:6px 14px;font-size:16px;cursor:pointer}
#dChoices button:hover{background:#2f4d8f}
#modal{position:absolute;inset:0;background:rgba(2,5,12,.72);display:flex;align-items:center;justify-content:center;z-index:40}
#mBox{width:780px;height:500px;padding:14px 18px;display:flex;flex-direction:column}
#mTabs{display:flex;gap:6px;margin-bottom:10px;align-items:center}
#mTabs button.tab{background:#17254a;color:var(--mute);border:2px solid #34507f;border-radius:6px;padding:5px 16px;font-size:14px;cursor:pointer}
#mTabs button.tab.on{background:#2b4170;color:#fff;border-color:var(--edge)}
#mClose{margin-left:auto;background:#5a2a3a;color:#fff;border:2px solid #ff9aa8;border-radius:6px;padding:5px 12px;cursor:pointer}
#mBody{flex:1;overflow:auto;font-size:14px;line-height:1.6}
.invWrap{display:flex;gap:16px;height:100%}
.lg h4{margin:10px 0 4px;color:var(--gold);font-size:14px}.lg .r{display:flex;flex-wrap:wrap;gap:4px 18px}.lg .r span{min-width:230px}.lg .no{color:#5f7399}.lg .yes{color:#cfe8ff}
.grid{display:grid;grid-template-columns:repeat(5,64px);grid-auto-rows:64px;gap:6px;align-content:start}
.slot{background:#101a33;border:2px solid #2d4476;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center}
.slot.has{cursor:pointer;border-color:#4d73b8}.slot.sel{border-color:var(--gold);background:#1e2f5a}
.slot img{width:44px;height:44px;image-rendering:pixelated}
.slot span{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700}
.info{flex:1;background:#101a33;border:2px solid #2d4476;border-radius:8px;padding:12px 16px}
.info h3{margin:0 0 6px;color:var(--gold)}
.info button{margin-top:10px;background:#2d7a4f;color:#fff;border:2px solid #7dffb0;border-radius:6px;padding:6px 18px;font-size:14px;cursor:pointer}
.qb{background:#101a33;border:2px solid #2d4476;border-radius:8px;padding:8px 14px;margin-bottom:8px}
.qb.main{border-color:var(--gold)}.qb h3{margin:0;font-size:15px}.qb.main h3{color:var(--gold)}
.qb.done{opacity:.6}.qb ul{margin:4px 0 0;padding-left:18px;list-style:none}.qb li.ok{color:#8fe6a8;text-decoration:line-through}.qb li.now{color:#fff}
.help td{padding:3px 14px 3px 0;vertical-align:top}.help kbd{background:#2b4170;border:1px solid var(--edge);border-radius:4px;padding:1px 7px}
#fade,#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:50;background:#000}
#flash{background:#fff;z-index:51}
#cards{position:absolute;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center;cursor:pointer}
#cardTxt{max-width:720px;text-align:center;font-size:24px;line-height:1.8;transition:opacity 1s;white-space:pre-wrap;color:#dce9ff}
#cardHint{position:absolute;bottom:26px;right:34px;color:#6f84ad;font-size:13px}
#banner{position:absolute;left:0;right:0;top:170px;text-align:center;z-index:25;pointer-events:none;animation:bn 3.6s forwards}
#banner small{display:block;font-size:16px;letter-spacing:6px;color:#aecbff}
#banner b{display:block;font-size:44px;text-shadow:0 0 16px #5fb0ff,0 3px 0 #000;margin-top:4px}
@keyframes bn{0%{opacity:0;transform:translateY(-10px)}15%,75%{opacity:1;transform:none}100%{opacity:0}}
#title{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#16396e 0,#0a1530 55%,#03050c 100%)}
#title .sub{letter-spacing:8px;color:#8fb8ff;font-size:15px}
#title h1{font-size:62px;margin:10px 0 4px;text-shadow:0 0 24px #4aa3ff,0 4px 0 #000}
#title .part{color:var(--gold);font-size:18px;margin-bottom:34px}
#title button{width:260px;margin:6px;background:#1d3059;color:#fff;border:3px solid var(--edge);border-radius:10px;padding:11px;font-size:19px;cursor:pointer}
#title button:hover{background:#2f4d8f}
#title button:disabled{opacity:.35;cursor:default}
#title .tip{margin-top:26px;color:#6f84ad;font-size:13px;text-align:center;line-height:1.7}
.bub{position:absolute;border-radius:50%;background:rgba(150,210,255,.25);border:1px solid rgba(190,230,255,.5);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-700px);opacity:0}}
#ending{position:absolute;inset:0;z-index:65;background:rgba(3,6,16,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#ending h2{font-size:46px;margin:0 0 6px;text-shadow:0 0 20px #5fb0ff}
#ending p{max-width:640px;line-height:1.9;color:#cfe0ff;font-size:17px}
#ending button{margin:6px;background:#1d3059;color:#fff;border:3px solid var(--edge);border-radius:10px;padding:10px 26px;font-size:17px;cursor:pointer}
#ending button:hover{background:#2f4d8f}
/* ===== UI 개편: 어두운 잉크블루 창 + 황동 테두리 (판타지 RPG 스타일) ===== */
:root{--panel:#141c3a;--edge:#d9b45f;--edge2:#6f5522;--ink:#f1ead6;--gold:#ffd77a;--mute:#a9a58f;--hl:#2a3866;--serif:'Gowun Batang','Noto Serif KR','Batang',serif}
.panel{background:linear-gradient(180deg,#1d2850 0,#0f1633 100%);border:3px solid var(--edge);border-radius:4px;
 box-shadow:0 0 0 2px #120d04,inset 0 0 0 2px #0a0f22,inset 0 0 0 3px var(--edge2),0 6px 16px rgba(0,0,0,.55);color:var(--ink)}
#btns{display:none!important}
.keycap{font-family:var(--serif);cursor:pointer;color:var(--ink)}
#bEsc{left:12px;top:12px;width:58px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
 background:linear-gradient(180deg,#2a3866,#141c3a);border:3px solid var(--edge);border-radius:6px;
 box-shadow:0 0 0 2px #120d04,inset 0 0 0 2px #0a0f22,0 4px 0 #120d04,0 6px 12px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}
#bEsc b{font-size:15px;letter-spacing:1px;color:var(--gold);line-height:1.1}
#bEsc span{font-size:10px;color:var(--mute);line-height:1}
#bEsc:hover{filter:brightness(1.2)}
#bEsc:active{transform:translateY(3px);box-shadow:0 0 0 2px #120d04,inset 0 0 0 2px #0a0f22,0 1px 0 #120d04}
#hp{left:80px;top:12px;height:46px;padding:0 14px 0 12px;gap:8px;font-family:var(--serif)}
#hp .lbl{color:#ff6b7a;font-size:24px;line-height:1;text-shadow:0 2px 0 #3a0a14,0 0 8px rgba(255,90,110,.6)}
.bar{width:116px;height:16px;background:#0a0f22;border:2px solid #3a2a12;border-radius:3px;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.bar i{background:linear-gradient(180deg,#ff9aa4 0,#e2455a 45%,#a82238 100%);border-radius:1px;position:relative}
.bar i::after{content:"";position:absolute;left:0;right:0;top:1px;height:3px;background:rgba(255,255,255,.35)}
#hpTxt{font-size:14px;color:var(--ink);min-width:54px;text-shadow:0 1px 0 #000}
#loc{top:12px;height:34px;padding:0 24px;display:flex;align-items:center;font-family:var(--serif);font-size:15px;letter-spacing:2px;color:var(--gold);text-shadow:0 1px 0 #000}
#loc::before,#loc::after{content:"◆";font-size:8px;color:var(--edge);margin:0 10px}
#loc::before{margin-left:0}#loc::after{margin-right:0}
#loc{font-size:0}#loc #locTxt{font-size:15px}
#qWrap{right:12px;top:12px;width:268px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none}
#qWrap>*{pointer-events:auto}
#qHead{width:100%;display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;color:var(--ink);font-family:var(--serif);font-size:14px;
 background:linear-gradient(180deg,#2a3866,#141c3a);border:3px solid var(--edge);border-radius:4px;box-shadow:0 0 0 2px #120d04,inset 0 0 0 2px #0a0f22}
#qHead:hover{filter:brightness(1.2)}
#qHead .dia{color:var(--gold);font-size:10px}
#qHead .qt{font-weight:700;color:var(--gold);white-space:nowrap}
#qHead .qn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--mute);display:none}
#qHead kbd{background:#0a0f22;border:1px solid var(--edge2);border-radius:3px;padding:0 5px;font-size:10px;color:var(--mute);font-family:inherit;margin-left:auto}
#qHead .arr{color:var(--gold);transition:transform .2s;font-size:12px}
#qWrap.col #qHead .arr{transform:rotate(-90deg)}
#qWrap.col #qHead .qn{display:block}
#qWrap.col #qHead kbd{margin-left:0}
#qWrap.col #quest{display:none}
#qWrap.col{width:auto;max-width:268px}
#qWrap.col #qHead{width:auto}
#qHead.new::after{content:"!";position:absolute;right:-6px;top:-8px;width:18px;height:18px;border-radius:50%;background:#e2455a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #120d04;animation:pulse 1s infinite}
#qHead{position:relative}
@keyframes pulse{50%{transform:scale(1.25)}}
#quest{width:100%;padding:9px 13px 10px;font-size:13px;line-height:1.55;font-family:inherit;background:linear-gradient(180deg,rgba(29,40,80,.9),rgba(15,22,51,.9))}
#quest h4{margin:0 0 3px;font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:1px}
#quest h4::before{content:"◆ ";font-size:8px;vertical-align:1px}
#quest .mt{font-family:var(--serif);font-size:15px;color:#fff;font-weight:700}
#quest .ms{color:#d8d2bd}
#quest .sd{border-top:1px solid #3a2f18;color:var(--mute)}
#toasts .toast,.toast{background:linear-gradient(180deg,#1d2850,#0f1633);border:2px solid var(--edge);border-radius:4px;box-shadow:0 0 0 2px #120d04,0 4px 10px rgba(0,0,0,.5);font-family:var(--serif)}
.toast.item{border-color:#8fe3a8}.toast.quest{border-color:var(--gold);color:var(--gold)}.toast.done{border-color:#f0a8d8;color:#ffd1ef}
#prompt{padding:5px 16px;font-family:var(--serif);font-size:15px;color:var(--ink)}
#prompt b{background:linear-gradient(180deg,#2a3866,#141c3a);border:2px solid var(--edge);border-radius:4px;color:var(--gold);padding:0 8px;box-shadow:0 2px 0 #120d04}
#dialog{padding:20px 26px 16px}
#dName{background:linear-gradient(180deg,#3a4a82,#1d2850);border:3px solid var(--edge);border-radius:4px;font-family:var(--serif);box-shadow:0 0 0 2px #120d04;top:-19px;left:20px;color:var(--gold);letter-spacing:1px}
#dText{color:#f4eedc}#dText.nar{color:#cfd6ee}
#dNext{color:var(--gold)}
#dChoices button{background:linear-gradient(180deg,#27346a,#17214a);border:2px solid var(--edge2);border-radius:4px;color:var(--ink)}
#dChoices button:hover{background:#3a4a82;border-color:var(--edge)}
#modal{background:rgba(4,6,14,.78)}
#mBox{width:800px;height:520px;padding:16px 20px 12px;position:relative}
#mTabs{gap:4px;border-bottom:2px solid var(--edge2);margin-bottom:12px;padding-bottom:0;align-items:flex-end}
#mTabs button.tab{background:#10173a;color:var(--mute);border:2px solid var(--edge2);border-bottom:none;border-radius:6px 6px 0 0;padding:6px 14px 5px;font-family:var(--serif);font-size:14px;position:relative;top:2px;transition:background .15s}
#mTabs button.tab:hover{background:#1f2b58;color:var(--ink)}
#mTabs button.tab.on{background:linear-gradient(180deg,#34447c,#1d2850);color:var(--gold);border-color:var(--edge);padding-bottom:8px;font-weight:700}
#mClose{margin-left:auto;background:#3a1620;color:#ffd5d5;border:2px solid #b0505f;border-radius:4px;padding:3px 11px;margin-bottom:6px;font-size:14px;cursor:pointer}
#mClose:hover{background:#5a2030}
#mBody{padding-right:4px}
#mBody::-webkit-scrollbar{width:8px}#mBody::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:4px}#mBody::-webkit-scrollbar-track{background:#0a0f22}
#mFoot{display:flex;gap:8px;align-items:center;border-top:2px solid var(--edge2);padding-top:9px;margin-top:8px}
#mFoot .hint{margin-left:auto;color:var(--mute);font-size:12px;font-family:var(--serif)}
#mFoot button{background:linear-gradient(180deg,#2f3f78,#1b2552);color:var(--ink);border:2px solid var(--edge);border-radius:4px;padding:5px 16px;font-family:var(--serif);font-size:14px;cursor:pointer;box-shadow:0 2px 0 #120d04}
#mFoot button:hover{filter:brightness(1.25)}#mFoot button:active{transform:translateY(2px);box-shadow:none}
.slot{background:#0b1230;border:2px solid #2f2a1a;border-radius:4px;box-shadow:inset 0 0 0 1px #000}
.slot.has{border-color:var(--edge2)}.slot.has:hover{border-color:var(--edge)}
.slot.sel{border-color:var(--gold);background:#27346a;box-shadow:0 0 8px rgba(255,215,122,.4)}
.slot span{color:#fff;text-shadow:0 1px 0 #000}
.info,.qb{background:#0b1230;border:2px solid var(--edge2);border-radius:4px}
.info h3,.qb h3{font-family:var(--serif)}
.info button{background:linear-gradient(180deg,#3d8a5c,#235a3a);border:2px solid #8fe3a8;border-radius:4px;font-family:var(--serif)}
.qb.main{border-color:var(--edge)}
.help kbd,.lg kbd{background:#0a0f22;border:1px solid var(--edge);color:var(--gold);border-radius:3px}
#banner b{font-family:var(--serif);text-shadow:0 0 18px rgba(255,200,110,.6),0 3px 0 #000}
#banner small{color:#e8d6a8;font-family:var(--serif)}
#title button,#ending button{background:linear-gradient(180deg,#2f3f78,#1b2552);border:3px solid var(--edge);border-radius:4px;font-family:var(--serif);box-shadow:0 0 0 2px #120d04,0 4px 0 #120d04}
#title button:hover,#ending button:hover{filter:brightness(1.25)}
#title .part{color:var(--gold);font-family:var(--serif)}
#title h1{font-family:var(--serif)}

#loc{left:334px;right:294px;transform:none;padding:0 14px;justify-content:center;overflow:hidden}
#loc #locTxt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:1px}
#loc::before,#loc::after{flex:none;margin:0 8px}

</style>
</head>
<body>
<div id="game">
  <canvas id="view" width="960" height="640"></canvas>

  <div id="hud" class="hidden">
    <button id="bEsc" class="keycap" title="메뉴 열기 (Esc)"><b>ESC</b><span>메뉴</span></button>
    <div id="hp" class="panel"><span class="lbl">♥</span><div class="bar"><i id="hpFill"></i></div><b id="hpTxt">100/100</b></div>
    <div id="btns">
      <button class="hb" id="bInv">🎒 인벤토리 <kbd>I</kbd></button>
      <button class="hb" id="bQuest">📜 퀘스트 <kbd>Q</kbd></button>
      <button class="hb" id="bLog">🗺 기록 <kbd>L</kbd></button>
      <button class="hb" id="bHelp">❔ 도움말 <kbd>H</kbd></button>
      <button class="hb" id="bSave">💾 저장</button>
      <button class="hb" id="bSnd">🔊</button>
    </div>
    <div id="loc" class="panel">📍 <span id="locTxt"></span></div>
    <div id="qWrap"><button id="qHead"><span class="dia">◆</span><span class="qt">퀘스트</span><span class="qn"></span><kbd>Tab</kbd><span class="arr">▾</span></button><div id="quest" class="panel"></div></div>
  </div>

  <div id="toasts"></div>
  <div id="prompt" class="panel hidden"></div>

  <div id="dialog" class="panel hidden">
    <div id="dName"></div>
    <div id="dText"></div>
    <div id="dChoices"></div>
    <div id="dNext" class="hidden">E ▶</div>
  </div>

  <div id="modal" class="hidden">
    <div id="mBox" class="panel">
      <div id="mTabs">
        <button class="tab" data-tab="inv">🎒 인벤토리</button>
        <button class="tab" data-tab="quest">📜 퀘스트</button>
        <button class="tab" data-tab="log">🗺 탐험 기록</button>
        <button class="tab" data-tab="help">❔ 조작법</button>
        <button id="mClose" title="닫기 (Esc)">✕</button>
      </div>
      <div id="mBody"></div>
      <div id="mFoot"><span class="hint">Esc · 닫기</span></div>
    </div>
  </div>

  <div id="banner" class="hidden"></div>
  <div id="fade"></div>
  <div id="flash"></div>
  <div id="cards" class="hidden"><div id="cardTxt"></div><div id="cardHint">E / 스페이스 / 클릭 ▶</div></div>
  <div id="ending" class="hidden"></div>

  <div id="title">
    <div class="sub">THE OTHER SIDE OF THE WORLD</div>
    <h1>세계의 뒷면</h1>

</div>

<script>
'use strict';
/* =====================================================================
   세계의 뒷면 — PART 1 : 프롤로그 & 멘지의 영역
   ---------------------------------------------------------------------
   구성  1.유틸  2.사운드  3.입력  4.스프라이트(코드로 그린 픽셀아트)
         5.맵 엔진  6.상태·퀘스트·인벤토리·저장  7.UI  8.대화
         9.게임 루프·렌더  10.콘텐츠(PART 1)  11.시작
   확장  PART 2, 3 은 10번 섹션과 같은 형식으로
         DATA.addMap / addItem / addQuest / addDialog 만 추가하면 됩니다.
   ===================================================================== */

/* ============================ 1. 유틸 ============================ */
const TILE=16, VW=480, VH=320;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hash2(x,y,s=0){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+1,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const PLAYER_NAME='이안';
const G={GRASS:0,PATH:1,WATER:2,SAND:3,STONE:4,BRIDGE:5,FOREST:6,DITCH:7,SHALLOW:8,SOIL:9,SEA:10,ROCK:11,
 LAVA:12,ASH:13,RED:14,BASALT:15,CWALL:16,CFLOOR:17,RUIN:18,OBBR:19,SCORCH:20,COBBLE:21,DRY:22,CROP:23,OWALL:24};
const SOLID_G=new Set([G.WATER,G.ROCK,G.LAVA,G.BASALT,G.CWALL,G.OWALL]);

/* ============================ 2. 사운드 ============================ */
const SFX={ctx:null,on:true,
 init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}},
 tone(f,d,type='square',v=.05,when=0,slide=0){if(!this.on||!this.ctx)return;try{const c=this.ctx,t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}catch(e){}},
 play(n){switch(n){
  case'blip':this.tone(500+Math.random()*90,.035,'square',.02);break;
  case'pick':this.tone(660,.08,'triangle',.07);this.tone(990,.14,'triangle',.07,.08);break;
  case'ok':[523,659,784,1046].forEach((f,i)=>this.tone(f,.2,'triangle',.07,i*.1));break;
  case'dig':this.tone(130,.13,'sawtooth',.08,0,-60);break;
  case'hurt':this.tone(200,.15,'sawtooth',.07,0,-100);break;
  case'open':this.tone(220,1.8,'sine',.08,0,600);break;
  case'splash':this.tone(420,.3,'sine',.05,0,300);break;}}
};

/* ============================ 3. 입력 ============================ */
/* e.code 를 사용하므로 한글 자판 상태에서도 WASD / E 가 동작합니다 */
const Input={keys:{},pressed:{},
 init(){
  addEventListener('keydown',e=>{const k=e.code;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();if(!e.repeat)this.pressed[k]=true;this.keys[k]=true;SFX.init();});
  addEventListener('keyup',e=>{this.keys[e.code]=false;});
  addEventListener('blur',()=>{this.keys={};});
 },
 down(...ks){return ks.some(k=>this.keys[k]);},
 hit(...ks){return ks.some(k=>this.pressed[k]);},
 endFrame(){this.pressed={};}
};

/* ============================ 4. 스프라이트 ============================ */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g);return c;}
function R(g,c,x,y,w=1,h=1){g.fillStyle=c;g.fillRect(x,y,w,h);}
function disc(g,cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y)+.5);g.fillRect(cx-w,cy+y,w*2,1);}}
function tri(g,cx,top,h,hw,c){g.fillStyle=c;for(let i=0;i<h;i++){const w=Math.max(1,Math.round(1+i*(hw*2-1)/Math.max(1,h-1)));g.fillRect(cx-Math.floor(w/2),top+i,w,1);}}

const Sprites={T:{},tree:{},obj:{},houses:{},chars:{},icons:{},
 init(){this.initTiles();this.initObjects();},
 initTiles(){
  const T=this.T;
  const speck=(g,base,cols,n,seed,tall)=>{R(g,base,0,0,16,16);const r=rng(seed);cols.forEach((c,ci)=>{for(let i=0;i<n;i++)R(g,c,r()*15|0,r()*14|0,1,(tall&&ci===0&&r()<.5)?2:1);});};
  T.grass=[0,1,2,3].map(v=>mk(16,16,g=>speck(g,'#5aab4b',['#4a9a3f','#74c35f'],9,11+v*13,true)));
  T.forest=[0,1,2,3].map(v=>mk(16,16,g=>speck(g,'#3e8447',['#2f7339','#58a55a'],9,31+v*17,true)));
  T.path=[0,1,2].map(v=>mk(16,16,g=>speck(g,'#cfa56f',['#b98f5a','#e2bd88'],8,51+v*7)));
  T.sand=[0,1].map(v=>mk(16,16,g=>speck(g,'#ecdca3',['#d9c78a','#f6ecc4'],7,71+v*5)));
  T.stone=[0,1].map(v=>mk(16,16,g=>{R(g,'#aab6cf',0,0,16,16);R(g,'#8f9cb8',0,0,16,1);R(g,'#8f9cb8',0,8,16,1);R(g,'#8f9cb8',v?4:9,0,1,8);R(g,'#8f9cb8',v?12:3,8,1,8);R(g,'#c9d4ea',1,1,4,1);R(g,'#c9d4ea',v?6:11,9,4,1);}));
  T.water=[0,1,2,3].map(f=>mk(16,16,g=>{R(g,'#3b8fd8',0,0,16,16);R(g,'#2f7cc2',0,12,16,4);for(const [y,o] of [[2,0],[7,6],[11,3]])R(g,'#7cc0f4',(o+f*4)%13,y,4,1);R(g,'#fff',(f*5+3)%15,(f*7+2)%14,1,1);}));
  T.shallow=[0,1,2,3].map(f=>mk(16,16,g=>{R(g,'#6cc4ee',0,0,16,16);R(g,'#58b2e0',0,13,16,3);for(const [y,o] of [[3,2],[9,8]])R(g,'#bfe9ff',(o+f*3)%12,y,4,1);R(g,'#fff',(f*4+5)%15,(f*3+9)%14,1,1);}));
  T.ditch=[0,1].map(v=>mk(16,16,g=>{R(g,'#8c6c47',0,0,16,16);R(g,'#6f5236',0,0,2,16);R(g,'#6f5236',14,0,2,16);R(g,'#a98862',3,0,10,16);const r=rng(91+v);for(let i=0;i<6;i++)R(g,'#7a5d3c',3+(r()*9|0),r()*15|0,2,1);R(g,'#c7ab86',4+(r()*7|0),r()*14|0,1,1);}));
  T.bridge=[mk(16,16,g=>{R(g,'#a97a4a',0,0,16,16);for(let y=0;y<16;y+=4)R(g,'#7f5632',0,y,16,1);R(g,'#c79a63',0,1,16,1);R(g,'#c79a63',0,9,16,1);R(g,'#4a2f18',1,2,1,1);R(g,'#4a2f18',14,10,1,1);})];
  T.soil=[0,1].map(v=>mk(16,16,g=>{R(g,'#7a5336',0,0,16,16);for(let y=2;y<16;y+=5)R(g,'#5f3f27',0,y,16,1);const r=rng(5+v);for(let i=0;i<4;i++){const x=2+(r()*11|0),y=1+(r()*4|0)*4;R(g,'#4fa845',x,y,1,2);R(g,'#7ad66b',x-1,y,1,1);R(g,'#7ad66b',x+1,y,1,1);}}));
  T.sea=[0,1,2].map(v=>mk(16,16,g=>speck(g,'#0b2347',['#10305e','#08193a'],7,211+v*3)));
  T.rock=[0,1,2].map(v=>mk(16,16,g=>{R(g,'#16213a',0,0,16,16);const r=rng(50+v);for(let i=0;i<5;i++)R(g,'#22345a',r()*12|0,r()*12|0,3+(r()*4|0),2+(r()*3|0));for(let i=0;i<4;i++)R(g,'#0f1830',r()*13|0,r()*13|0,2,2);R(g,'#2f4a7c',2+(r()*8|0),2,3,1);}));
 },
 /* ---- 캐릭터 ---- */
 charSheet(p){
  const key=JSON.stringify(p);if(this.chars[key])return this.chars[key];
  const sh={};
  for(const d of['down','up','left']){sh[d]=[0,1,2].map(f=>this.charFrame(p,d,f));}
  sh.right=sh.left.map(c=>mk(16,20,g=>{g.translate(16,0);g.scale(-1,1);g.drawImage(c,0,0);}));
  return this.chars[key]=sh;
 },
 charFrame(p,dir,fr){return mk(16,20,g=>{
  const side=dir==='left',ex=p.extra||[];
  const lL=fr===1?1:0,lR=fr===2?1:0;
  if(dir==='up'&&ex.includes('cape'))R(g,p.capeC,3,9,10,9);
  if(!side){R(g,p.bottom,5,14,3,4-lL);R(g,p.bottom,8,14,3,4-lR);R(g,p.shoe,5,18-lL,3,2);R(g,p.shoe,8,18-lR,3,2);}
  else{const a=fr===1?-1:fr===2?1:0;R(g,p.bottom,5+a,14,3,4);R(g,p.bottom,8-a,14,3,4);R(g,p.shoe,5+a,18,4,2);R(g,p.shoe,8-a,18,4,2);}
  R(g,p.top,4,9,8,6);R(g,p.belt||p.top,4,13,8,1);
  if(ex.includes('robe')){R(g,p.top,4,13,8,5);R(g,p.belt,4,13,8,1);}
  if(!side){R(g,p.top,3,10,1,4);R(g,p.top,12,10,1,4);R(g,p.skin,3,14,1,1);R(g,p.skin,12,14,1,1);}
  else{const s=fr===1?1:fr===2?-1:0;R(g,p.top,6+s,10,3,4);R(g,p.skin,6+s,14,3,1);}
  if(ex.includes('apron')){if(!side)R(g,'#f6f1e4',5,10,6,5);else R(g,'#f6f1e4',4,10,3,5);}
  if(ex.includes('cape')&&dir==='down'){R(g,p.capeC,3,9,1,7);R(g,p.capeC,12,9,1,7);}
  R(g,p.skin,4,3,8,7);
  if(p.skinD){R(g,p.skinD,4,9,8,1);}
  const hs=p.hs||'short';
  if(dir==='down'){R(g,p.hair,3,2,10,3);R(g,p.hair,3,4,1,3);R(g,p.hair,12,4,1,3);R(g,'#1b2233',6,6,1,2);R(g,'#1b2233',9,6,1,2);R(g,'#e88a8a',7,8,2,1);if(hs==='long'){R(g,p.hair,3,6,1,6);R(g,p.hair,12,6,1,6);}if(hs==='bun')R(g,p.hair,6,0,4,2);}
  else if(dir==='up'){R(g,p.hair,3,2,10,8);if(hs==='long')R(g,p.hair,3,9,10,4);if(hs==='bun')R(g,p.hair,6,0,4,2);}
  else{R(g,p.hair,3,2,10,3);R(g,p.hair,9,4,4,5);R(g,'#1b2233',5,6,1,2);if(hs==='long')R(g,p.hair,9,8,4,5);if(hs==='bun')R(g,p.hair,10,1,4,3);}
  if(ex.includes('beard')&&dir!=='up'){R(g,p.beardC||'#e8edf5',side?4:5,8,side?4:6,2);}
  if(ex.includes('cap')){R(g,p.capC,3,1,10,3);if(dir==='down')R(g,p.capC,3,3,10,1);}
  if(ex.includes('straw')){R(g,'#e6c35a',1,2,14,2);R(g,'#cfa63e',4,0,8,3);}
 });},
 /* ---- 아이템 아이콘 ---- */
 icon(id){
  if(this.icons[id])return this.icons[id];
  const F={
   shovel:g=>{R(g,'#8a5a2e',7,1,2,9);R(g,'#b98a52',7,1,1,9);R(g,'#8a5a2e',5,1,6,1);R(g,'#c9d3df',5,9,6,5);R(g,'#8f9db0',5,13,6,1);},
   herb:g=>{R(g,'#3f9a46',7,6,2,9);disc(g,5,5,2,'#58c35a');disc(g,11,6,2,'#58c35a');disc(g,8,3,2,'#86e07a');},
   glow_shell:g=>{disc(g,8,9,5,'#8fe9ff');disc(g,8,9,3,'#d9fbff');for(let i=0;i<5;i++)R(g,'#4ec7e8',3+i*2,5+(i%2),1,7);R(g,'#fff',6,6,2,1);},
   wood_doll:g=>{R(g,'#c8935a',6,1,4,4);R(g,'#a97a46',5,5,6,6);R(g,'#c8935a',3,6,2,3);R(g,'#c8935a',11,6,2,3);R(g,'#8a5e35',6,11,2,4);R(g,'#8a5e35',8,11,2,4);R(g,'#222',7,3,1,1);R(g,'#222',9,3,1,1);},
   star_apple:g=>{disc(g,8,9,5,'#e8a825');disc(g,8,9,4,'#ffd447');R(g,'#fff3a0',6,7,2,2);R(g,'#5a3a1e',8,2,1,3);R(g,'#58c35a',9,2,3,2);},
   blue_mushroom:g=>{disc(g,8,7,5,'#3f6fe0');R(g,'#3f6fe0',3,7,10,2);R(g,'#9fd0ff',5,5,2,2);R(g,'#9fd0ff',10,7,2,1);R(g,'#f4f0e0',7,9,3,5);R(g,'#d9d2bd',7,13,3,1);},
   star_pie:g=>{disc(g,8,9,6,'#b9793a');disc(g,8,9,5,'#e0a45c');for(let i=2;i<14;i+=3){R(g,'#b9793a',i,4,1,10);R(g,'#b9793a',3,i,10,1);}R(g,'#ffd447',7,8,2,2);},
   tori_charm:g=>{for(let i=0;i<12;i++){const a=i/12*Math.PI*2;R(g,i%2?'#ff9fc8':'#ffd447',8+Math.round(Math.cos(a)*5),8+Math.round(Math.sin(a)*5),2,2);}},
   menji_pendant:g=>{R(g,'#c9d3df',4,1,1,5);R(g,'#c9d3df',11,1,1,5);R(g,'#c9d3df',5,6,1,1);R(g,'#c9d3df',10,6,1,1);tri(g,8,6,9,6,'#4aa3ff');disc(g,8,11,3,'#4aa3ff');R(g,'#d9f0ff',7,9,2,2);},
   bread:g=>{disc(g,8,9,5,'#b9793a');R(g,'#b9793a',3,8,10,3);disc(g,8,8,4,'#e0a45c');R(g,'#b9793a',5,6,1,3);R(g,'#b9793a',8,5,1,3);R(g,'#b9793a',11,6,1,3);},
   sena_tea:g=>{R(g,'#e8e0cf',4,6,8,7);R(g,'#c9bfa8',4,12,8,1);R(g,'#e8e0cf',12,7,2,4);R(g,'#6fc98a',5,7,6,2);R(g,'#fff',6,2,1,3);R(g,'#fff',9,1,1,3);}
  };
  const c=mk(16,16,g=>{(F[id]||(g=>R(g,'#fff',4,4,8,8)))(g);});
  return this.icons[id]=c;
 },
 /* ---- 맵 오브젝트 ---- */
 initObjects(){
  const O=this.obj,Tr=this.tree;
  const mkTree=(kind)=>mk(32,40,g=>{
   R(g,'#5a3a1e',14,26,4,14);R(g,'#7a5230',14,26,2,14);R(g,'#3f2814',12,38,8,2);
   if(kind==='pine'){tri(g,16,1,14,12,'#1f5f3a');tri(g,16,9,14,18,'#2a7a46');tri(g,16,17,12,24,'#38975a');tri(g,16,4,6,5,'#4fb06f');return;}
   const P={oak:['#2b6a35','#3d8c46','#58b552','#86dc72'],blue:['#1d5876','#2b86a0','#46b8c8','#9af0f4'],apple:['#2b6a35','#3d8c46','#58b552','#86dc72']}[kind];
   disc(g,16,15,13,P[0]);disc(g,9,17,8,P[0]);disc(g,23,17,8,P[0]);
   disc(g,16,15,12,P[1]);disc(g,9,17,7,P[1]);disc(g,23,17,7,P[1]);
   disc(g,15,13,10,P[2]);disc(g,9,16,6,P[2]);disc(g,22,15,6,P[2]);
   disc(g,12,9,5,P[3]);disc(g,19,11,3,P[3]);
   if(kind==='blue'){for(const [x,y] of [[9,14],[20,10],[15,19],[24,17]])R(g,'#fff',x,y,1,1);}
   if(kind==='apple'){for(const [x,y] of [[8,14],[15,8],[21,13],[12,20],[24,19],[17,16]]){R(g,'#e8a825',x,y,3,3);R(g,'#ffd447',x,y,2,2);R(g,'#fff3a0',x,y,1,1);}}
  });
  for(const k of['oak','pine','blue','apple'])Tr[k]=mkTree(k);
  O.bush=mk(16,16,g=>{disc(g,8,10,6,'#2b6a35');disc(g,5,10,4,'#3d8c46');disc(g,11,10,4,'#3d8c46');disc(g,8,8,4,'#58b552');R(g,'#86dc72',6,6,2,1);R(g,'#ff9fc8',10,9,1,1);R(g,'#ff9fc8',5,11,1,1);});
  O.fenceH=mk(16,16,g=>{R(g,'#b88550',0,7,16,2);R(g,'#b88550',0,11,16,2);R(g,'#9a6b3c',1,5,3,10);R(g,'#9a6b3c',12,5,3,10);R(g,'#c9985e',1,5,3,1);R(g,'#c9985e',12,5,3,1);});
  O.fenceV=mk(16,16,g=>{R(g,'#9a6b3c',6,0,4,16);R(g,'#b88550',6,0,2,16);R(g,'#c9985e',6,2,4,1);R(g,'#c9985e',6,10,4,1);});
  O.sign=mk(16,24,g=>{R(g,'#6a4526',7,10,2,14);R(g,'#c79a63',1,2,14,10);R(g,'#8a5e35',1,2,14,1);R(g,'#8a5e35',1,11,14,1);R(g,'#5b3b22',3,5,10,1);R(g,'#5b3b22',3,8,7,1);});
  O.board=mk(32,28,g=>{R(g,'#6a4526',3,10,3,18);R(g,'#6a4526',26,10,3,18);R(g,'#b88550',1,1,30,17);R(g,'#8a5e35',1,1,30,1);R(g,'#8a5e35',1,17,30,1);R(g,'#f4efe0',4,4,8,6);R(g,'#f4efe0',14,4,6,9);R(g,'#f4efe0',22,5,7,6);R(g,'#c0392b',8,3,1,1);R(g,'#5b3b22',5,6,6,1);R(g,'#5b3b22',15,6,4,1);R(g,'#5b3b22',15,9,4,1);});

  });
  c.windows=wins;return this.houses[key]=c;
 }

  R(g,'#1f8a5a',3,22,2,2);R(g,'#1f8a5a',10,22,2,2);

  R(g,'#26395f',0,14,18,82);R(g,'#26395f',110,14,18,82);R(g,'#34507f',0,14,3,82);R(g,'#34507f',110,14,3,82);
  const gap=Math.floor(open*40),pulse=.5+.5*Math.sin(t*2);

  for(const [dx,dir] of [[0,1],[1,-1]]){const bx=dx?64+gap:64-gap;
   for(let i=0;i<5;i++){const y=26+i*14;R(g,'#6fe9ff',bx+dir*8-(dx?0:8),y,8,1);R(g,'#6fe9ff',bx+dir*14-(dx?0:2),y,1,6);R(g,'#6fe9ff',bx+dir*20-(dx?0:8),y+5,8,1);}}

  disc(g,64,10,6,'#16213a');g.globalAlpha=.5+.5*pulse;disc(g,64,10,4,'#6fe9ff');g.globalAlpha=1;
 },
 jelly(g,x,y,t,s){
  const p=.5+.5*Math.sin(t*2+x);
  g.globalAlpha=.18;disc(g,x,y,12*s,'#9af0ff');g.globalAlpha=.8;
  disc(g,x,y,5*s,'#8fd9ff');R(g,'#8fd9ff',x-5*s,y,10*s,2);R(g,'#e6fcff',x-2*s,y-3*s,2,1);
  for(let i=-2;i<=2;i++){const sw=Math.round(Math.sin(t*3+i)*1);R(g,'#6fc0ee',x+i*2*s+sw,y+2,1,(5+p*3)*s);}

<script>
/* ============================ 5. 맵 엔진 ============================ */
class GameMap{
 constructor(id,w,h,o){this.id=id;this.w=w;this.h=h;this.name=o.name||'';this.theme=o.theme||'village';
  this.ground=new Uint8Array(w*h);this.solid=new Uint8Array(w*h);this.walls=[];
  this.objs=[];this.npcs=[];this.pickups=[];this.acts=[];this.triggers=[];this.hazards=[];this.glows=[];this.regen=[];this.critters=[];this.keep=new Set();this.doorOpen=0;}
 inb(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h;}
 get(x,y){return this.inb(x,y)?this.ground[y*this.w+x]:255;}
 set(x,y,v){if(this.inb(x,y))this.ground[y*this.w+x]=v;}
 fill(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)this.set(i,j,v);}
 ellipse(cx,cy,rx,ry,v){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,v);}}
 brush(x0,y0,x1,y1,r,v,wide){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2||1;
  for(let i=0;i<=n;i++){const x=Math.round(lerp(x0,x1,i/n)),y=Math.round(lerp(y0,y1,i/n));
   for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)this.set(x+dx,y+dy,v);if(wide){this.set(x+1,y,v);this.set(x,y+1,v);}}}
 poly(pts,r,v,wide){for(let i=0;i<pts.length-1;i++)this.brush(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],r,v,wide);}
 blockRect(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(this.inb(i,j))this.solid[j*this.w+i]=1;}
 addObj(o){this.objs.push(o);if(o.solid)o.solid.forEach(r=>this.blockRect(r.x,r.y,r.w,r.h));return o;}
 removeObj(o){const i=this.objs.indexOf(o);if(i>=0)this.objs.splice(i,1);this.rebuildSolid();}
 rebuildSolid(){this.solid.fill(0);for(let i=0;i<this.ground.length;i++){const g=this.ground[i];if(SOLID_G.has(g))this.solid[i]=1;}
  for(const o of this.objs)if(o.solid)for(const r of o.solid)this.blockRect(r.x,r.y,r.w,r.h);for(const r of this.walls)this.blockRect(r.x,r.y,r.w,r.h);}
 isSolid(x,y){return!this.inb(x,y)||this.solid[y*this.w+x]===1;}
 free(tx,ty){for(let r=0;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=tx+dx,y=ty+dy;if(this.inb(x,y)&&!this.isSolid(x,y)){const g=this.get(x,y);if(!SOLID_G.has(g))return[x,y];}}return[tx,ty];}
 keepAround(tx,ty,r=1){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)this.keep.add((tx+dx)+','+(ty+dy));}
}

/* ---- 맵 빌더 헬퍼 ---- */
const World={
 tree(m,tx,ty,kind='oak'){return m.addObj({x:tx*16-8,y:(ty+1)*16-40,w:32,h:40,sortY:(ty+1)*16,spr:Sprites.tree[kind],solid:[{x:tx,y:ty,w:1,h:1}],kind});},
 obj(m,tx,ty,spr,o={}){const w=spr.width,h=spr.height;return m.addObj(Object.assign({x:tx*16,y:(ty+1)*16-h,w,h,sortY:(ty+1)*16,spr,solid:o.solid===undefined?[{x:tx,y:ty,w:1,h:1}]:o.solid},o));},
 house(m,tx,ty,w,h,o){const spr=Sprites.house(w,h,o);const ob={x:tx*16,y:ty*16,w:w*16,h:h*16,sortY:(ty+h)*16,spr,solid:[{x:tx,y:ty,w,h}],windows:spr.windows};
  if(o.smoke)ob.draw=(g,t)=>{g.drawImage(spr,0,0);Dyn.smoke(g,t,w*16-12,2);};return m.addObj(ob);},
 /* 나무/덤불을 자동으로 흩뿌린다(길·건물·핵심 지점은 피함) */
 scatter(m,seed,cfg){
  const r=rng(seed),grid=new Uint8Array(m.w*m.h);
  const near=(x,y,rad,ids)=>{for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++)if(ids.includes(m.get(x+dx,y+dy)))return true;return false;};
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){
   const g=m.get(x,y);if(m.isSolid(x,y)||m.keep.has(x+','+y))continue;
   let dens=0,kinds;
   if(g===G.FOREST){dens=cfg.forest;kinds=['oak','oak','pine','pine','blue'];}
   else if(g===G.GRASS){dens=cfg.grass;kinds=['oak','oak','pine'];}
   if(!dens||r()>dens)continue;
   if(near(x,y,1,[G.PATH,G.STONE,G.DITCH,G.SHALLOW,G.SOIL,G.BRIDGE,G.WATER,G.SAND]))continue;
   let crowd=false;for(let dy=-1;dy<=1&&!crowd;dy++)for(let dx=-1;dx<=1;dx++)if(grid[(y+dy)*m.w+x+dx]){crowd=true;break;}
   if(crowd)continue;

  }

  /* 가시덤불 */
  let inHaz=false;const p=this.player;for(const h of m.hazards){if(p.x>h.x-4&&p.x<h.x+h.w+4&&p.y>h.y&&p.y<h.y+h.h+8){inHaz=h;break;}}

/* ---------- 공용 ---------- */
function addNPC(m,id,name,tx,ty,p,o={}){
 const [fx,fy]=m.free(tx,ty);
 const n=Object.assign({id,name,x:fx*16+8,y:fy*16+14,pal:p,dir:'down',anim:0,moving:false,talking:false,wander:0,hx:fx*16+8,hy:fy*16+14,wt:Math.random()*2,target:null,path:null},o);
 m.npcs.push(n);m.keepAround(fx,fy,1);return n;
}
function npcWalk(n,pts,speed,done){n.path=pts.map(([tx,ty])=>({x:tx*16+8,y:ty*16+14}));n.pathSpeed=speed||44;n.wander=0;return new Promise(r=>{n.onArrive=()=>{if(done)done();r();};});}
function addAct(m,a){a.x=a.tx*16+8;a.y=a.ty*16+10;m.acts.push(a);m.keepAround(a.tx,a.ty,1);return a;}
function addPickup(m,id,item,tx,ty,n=1){if(flag('pk_'+id))return;const [fx,fy]=m.free(tx,ty);m.pickups.push({id,item,n,x:fx*16+8,y:fy*16+14});m.keepAround(fx,fy,1);}
const note=(lines2)=>Dlg.say('',lines2.map(t=>nar(t)));
function npcByIdIn(id){return Game.map.npcs.find(n=>n.id===id);}

async function digMud(m){
 if(!has('shovel')){await note(['진흙과 굵은 나뭇가지가 수로를 완전히 틀어막고 있다. 위쪽에는 물이 고여 찰랑거린다.','맨손으로는 어림도 없다. 도구가 필요하다.']);if(Q.stage('main1')===2)Q.advance('main1',3);return;}
 S.flags.dig=(S.flags.dig||0)+1;SFX.play('dig');Game.shakeNow(.25);
 if(S.flags.dig===1)await note(['삽 끝을 진흙 속에 꽂아 넣었다. 생각보다 단단하다. 몇 번이고 파내야겠다.']);
 else UI.toast(`퍽! 진흙을 파냈다 (${S.flags.dig}/3)`,'info');
 if(S.flags.dig<3)return;
 setf('channel_fixed');m.removeObj(m.mud);SFX.play('splash');Game.shakeNow(.7);
 Q.advance('main1',5);
 await note(['마지막 한 삽을 떠내자, 굵은 가지가 우두둑 소리를 내며 굴러떨어졌다.','막혀 있던 물이 콸콸 쏟아져 나온다 — 수로를 따라 마을 쪽으로 물이 흘러가기 시작했다!']);
 for(const [x,y] of m.ditchList){if(Game.map!==m)break;m.set(x,y,G.SHALLOW);if((x+y)%3===0)SFX.play('splash');await sleep(260);}
 setf('fountain_wet');addTrust(1);Save.auto();
}

P2.go=async function(to,tx,ty,dir,opts={}){
 if(Game.cut)return;Game.cut=true;UI.prompt(null);

Game.faint=async function(){
 if(this.cut)return;this.cut=true;await UI.fade(1,700);S.hp=Math.round(S.maxHp*.5);UI.setHP();
 const m=this.map,sp2=m.spawn||(S.map==='village'?[8*16+8,21*16+14]:[this.player.x,this.player.y]);
 this.player.x=sp2[0];this.player.y=sp2[1];this.player.vx=this.player.vy=0;this.updateCam(true);
 await UI.fade(0,700);
 await Dlg.say('',m.faintLines||['눈을 떠 보니 누군가 곁에서 따뜻한 차를 끓이고 있었다.','"무리하지 마. 가시덤불은 생각보다 아프니까." — 세나의 목소리였다.']);
 this.cut=false;
};

/* -------------------------------- 9. BGM -------------------------------- */
const BGM=P2.BGM={mode:null,step:0,timer:null,
 set(m){this.mode=m;if(m&&!this.timer)this.timer=setInterval(()=>this.tick(),230);},
 tick(){const m=this.mode;if(!m||!SFX.ctx||!SFX.on)return;const s=this.step++;
  if(m==='orc'||m==='forest'){
   if(s%16===0){SFX.tone(55,3.6,'sawtooth',.016);SFX.tone(82.4,3.6,'triangle',.02);}
   if(s%4===0)SFX.tone(70,.18,'sine',.06,0,-40);
   if(s%8===6)SFX.tone(60,.14,'sine',.045,0,-30);
   if(m==='orc'&&s%32===8)[220,196,174.6,164.8].forEach((f,i)=>SFX.tone(f,.9,'triangle',.02,i*.5));
   if(m==='forest'&&s%24===5)[146.8,174.6,196,174.6].forEach((f,i)=>SFX.tone(f,1.1,'sine',.025,i*.6));
   if(Math.random()<.05)SFX.tone(300+Math.random()*300,.2,'sine',.012,0,-90);
  }else if(m==='cave'){
   if(s%24===0){const n=[196,233,262,294][(Math.random()*4)|0];SFX.tone(n/2,4,'sine',.03);SFX.tone(n,3,'triangle',.012,.5);}
   if(Math.random()<.05)SFX.tone(800+Math.random()*600,.5,'sine',.006,0,-200);
  }else if(m==='hall'){
   if(s%16===0)SFX.tone(65.4,3.6,'sawtooth',.014);
   if(s%8===0)SFX.tone(65,.25,'sine',.055,0,-30);
   if(s%32===4)[262,311,349,392].forEach((f,i)=>SFX.tone(f/2,1.2,'triangle',.02,i*.4));
  }}};
/* 대장간 망치 소리 */
setInterval(()=>{const m=Game.map;if(!m||m.id!=='orc_town'||!m.forgeAt||Game.cut||!SFX.ctx)return;
 const d=Math.hypot(Game.player.x-m.forgeAt.x,Game.player.y-m.forgeAt.y);if(d>260)return;
 const v=.05*(1-d/260);SFX.tone(1700+Math.random()*300,.07,'square',v);SFX.tone(900,.12,'triangle',v,.12);},1350);

/* ------------------------------ 10. 오크 지역 오버레이 ------------------------------ */
Game.drawOrcOverlay=function(g,m,cam,t){
 const p=this.player,px=p.x-cam.x,py=p.y-cam.y-8;
 const heat=m.heatFn?m.heatFn(p.x,p.y):(m.heat===undefined?1:m.heat);
 if(m.theme==='orc'){
  g.fillStyle=`rgba(255,70,15,${((.05+.04*Math.sin(t*1.3))*heat+.01).toFixed(3)})`;g.fillRect(0,0,VW,VH);
  g.fillStyle=`rgba(255,160,80,${(.045*heat).toFixed(3)})`;
  for(let i=0;i<5;i++){const y=(t*16+i*67)%VH;g.fillRect(0,y|0,VW,1);g.fillRect(((Math.sin(t+i)*10)|0),(y+3)|0,VW,1);}
  const n=Math.floor(this.amb.length*clamp(heat,.15,1));
  for(let i=0;i<n;i++){const a=this.amb[i];a.y-=a.s*.35;a.x+=Math.sin(t*1.5+a.p)*.25+.12;if(a.y<-2){a.y=VH+2;a.x=Math.random()*VW;}if(a.x>VW+2)a.x=-2;
   g.fillStyle=(i%3)?'rgba(255,150,50,.85)':'rgba(255,220,120,.9)';g.fillRect(Math.round(a.x),Math.round(a.y),1,i%4===0?2:1);}
  const vg=g.createRadialGradient(VW/2,VH/2,110,VW/2,VH/2,300);vg.addColorStop(0,'rgba(30,6,0,0)');vg.addColorStop(1,`rgba(30,6,0,${.28+.17*heat})`);g.fillStyle=vg;g.fillRect(0,0,VW,VH);
 }else{
  return; /* 잊힌 유적(cave 테마)에서는 광원/어둠 오버레이 효과를 제거하여 또렷하게 표시 */
 }
 g.globalCompositeOperation='lighter';
 for(const l of m.glows){const x=l.x-cam.x,y=l.y-cam.y;if(x<-90||x>VW+90||y<-90||y>VH+90)continue;
  const fl=.85+.15*Math.sin(t*(l.sp||4)+l.x*.37),a=(l.a===undefined?.6:l.a)*(m.theme==='cave'?1.15:Math.max(.45,heat));
  const gr=g.createRadialGradient(x,y,1,x,y,l.r*fl);gr.addColorStop(0,`rgba(${l.c||'255,120,40'},${a})`);gr.addColorStop(1,`rgba(${l.c||'255,120,40'},0)`);g.fillStyle=gr;g.fillRect(x-l.r,y-l.r,l.r*2,l.r*2);}
 for(const o of m.objs)if(o.windows){for(const w of o.windows){const x=o.x+w.x-cam.x,y=o.y+w.y-cam.y;if(x<-20||x>VW||y<-20||y>VH)continue;g.fillStyle='rgba(255,150,50,.5)';g.fillRect(x,y,w.w,w.h);}}
 g.globalCompositeOperation='source-over';
};
/* 용암 강 주변에 자동으로 빛을 배치 */
P2.lavaGlows=(m,step=3)=>{for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)if(m.get(x,y)===G.LAVA&&((x*7+y*13)%step===0)&&(x+y)%2===0)m.glows.push({x:x*16+8,y:y*16+8,r:40,c:'255,110,30',a:.5,sp:2+((x*y)%3)});};

/* ------------------------------ NPC 순찰 ------------------------------ */
const _un=Game.updateNPC;
Game.updateNPC=function(n,dt,wander){
 if(n.patrol){
  if(n.talking){n.moving=false;return;}
  if(wander&&!(n.path&&n.path.length)){n.pw=(n.pw||0)-dt;if(n.pw<=0){n.pi=((n.pi||0)+1)%n.patrol.length;const [tx,ty]=n.patrol[n.pi];n.path=[{x:tx*16+8,y:ty*16+14}];n.pathSpeed=24;n.pw=2+Math.random()*3;n.wander=0;}}
 }
 _un.call(this,n,dt,wander);
};

const _vm=DATA.maps.village;
const openWest=(m)=>{
 m.acts=m.acts.filter(a=>a.id!=='gate_w');
 m.objs=m.objs.filter(o=>!(o.solid&&o.solid.some(r=>r.x<4&&r.y>=21&&r.y<=25)));
 /* PART 1 의 보이지 않는 테두리 벽(x 0~1)에서 서쪽 길 3줄을 비운다 */
 m.walls=m.walls.flatMap(r=>(r.x===0&&r.w===2&&r.y===0&&r.h>=44)?[{x:0,y:0,w:2,h:22},{x:0,y:25,w:2,h:r.h-25}]:[r]);
 m.rebuildSolid();
 if(!m.triggers.some(t=>t.id==='village_to_pass'))P2.exit(m,'village_to_pass',0,22,2,3,()=>P2.go('orc_pass',68,P2.passY(68),'left'));
};

   {text:'오크분들은 이 땅을 떠나지 않으셨네요.',lines:[OR('떠날 수도 있었지. 멘지의 땅은 푸르고, 푸람의 하늘은 높으니. 하지만 오크는 고향을 버리지 않네.'),OR('불에 타는 땅에서도 가족은 가족이고, 친구는 친구라네. 우리는 이곳에서 사는 법을 배웠지. ……그게 우리 방식이네.')]}]),
  me('저도 하나 말씀드릴게요. 저는 바다 밑에 있는 거대한 문을 지나 이 세계에 왔어요. 벽화의 문양과 똑같은 문양이 그 문에 새겨져 있었어요.'),
  nar('오르가의 눈이 아주 잠깐 흔들렸다. 용암의 붉은 빛이 그의 흉터 위로 일렁인다.'),
  OR('……문. 노래 속의 이야기가 아니었군.'),
  OR('그 문에 대해 우리는 아는 바가 없네. 다만 이것만은 말해 두겠네.'),
  OR('이 세계에는 우리가 모르는 규칙이 있다. 그리고 그 규칙을 바꾸려는 자는, 언제나 대가를 치르게 되지.',()=>setf('lore_rule')),
  me('……규칙이요? 어떤 규칙인가요?'),
  OR('내가 안다면 이렇게 두려워하지 않았을 걸세. 다만 오래 살다 보면, 아는 것보다 모르는 것이 더 많다는 걸 알게 된다네.'),
  nar('문득, 바다 밑에서 품었던 막연한 기대가 떠올랐다. 내가 떠나온 세계와 이 세계가 서로 닿을 수 있다면 좋겠다는 생각.'),nar('……그것도, 규칙을 바꾸는 일일까.'),
  OR('동쪽을 보게. 구름 위에 푸람이 산다네. 날개를 가진 작은 이들이지. 세계의 오래된 기록과 지식을 지켜 온 종족일세.'),
  OR('그들이라면 자네의 문에 대해서도, 이 땅의 열기에 대해서도 우리보다 많이 알 걸세. 쉽게 입을 열어 줄지는 모르겠네만.',()=>setf('lore_puram')),
  OR('자네는 이 땅에서 의심을 받았고, 그 의심을 스스로 걷어 냈네. ……그래서 동쪽으로 떠나기 전에, 자네에게 꼭 부탁하고 싶은 마지막 일이 하나 있네.'),
  OR('최근 불타는 숲 깊은 곳에 거대한 용암 도마뱀 괴수 [이그닐]이 깨어났네. 비늘 사이사이로 끓는 용암이 흐르는 흉포한 녀석이지.'),
  OR('그 이그닐 때문에 숲으로 나무나 열매를 구하러 간 우리 주민들이 사냥당하는 일이 잦아졌네. 화염 저항을 지녀 불조차 통하지 않으니 피해가 막심하네.'),
  me('주민분들이 사냥당하고 있다고요……?! 제가 불타는 숲 깊은 곳으로 가서 이그닐을 처치하겠습니다!'),
  OR('고맙네, 이안! 이그닐의 서식지는 불타는 숲 남동쪽 가장 깊은 곳에 있네. 녀석이 한 턴 동안 힘을 모으면 모든 아군을 불태우는 맹렬한 공격을 퍼부으니 반드시 대비하게!')],()=>{Q.advance('o6',2);P2.check();});
 if(Q.stage('o_ignil')===0)return[
  OR('이그닐의 서식지는 불타는 숲 남동쪽 깊은 곳(좌표 54, 36 부근)에 있네. 이그닐 때문에 주민들이 사냥당하는 일이 잦으니 부디 조심해서 처치해 주게.'),
  OR('녀석은 [화염 저항] 패시브로 발화를 무시하고, 한 턴 힘을 모은 뒤 전체에 30 대미지와 발화를 입히는 특수 공격을 쓴다네.')];
 if(Q.stage('o_ignil')===1)return lines([
  OR('이안! 돌아왔군! 불타는 숲의 흉포한 기운이 잠잠해진 걸 보니…… 정말로 이그닐을 쓰러뜨린 게로군!'),
  me('네, 이그닐을 처치했습니다. 이제 주민분들이 숲에서 사냥당할 일은 없을 거예요.'),
  OR('오크의 이름으로 깊이 감사하네. 자네는 우리 마을의 은인이야. 이제 안심하고 마을 사람들에게 작별 인사를 나눈 뒤 동쪽 푸람의 영역으로 떠나게!')
 ],()=>{Q.advance('o_ignil',2);P2.check();});
 if(Q.stage('o7')===0||Q.stage('o7')===1){
  if(!Q.done('o_ignil')&&Q.stage('o_ignil')===-1){Q.start('o_ignil');return[OR('떠나기 전에 불타는 숲 남동쪽 깊은 곳(이그닐의 서식지)에 나타난 보스 이그닐을 처치해 주게!')];}
  return[OR('작별을 마치게. 오크는 말없이 떠나는 이를 오래 기억하네. ……그건 그리 좋은 기억이 아니지.'),OR('동쪽 출구는 협곡의 끝이네. 길은 멀지만, 가는 동안 불씨가 자네를 지켜 줄 걸세.')];
 }
 return[OR('불씨는 꺼지지 않네. 푸람의 이야기를 듣게 되면, 돌아와서 들려주게나.'),OR('이 세계의 규칙을 바꾸려는 자가 치르는 대가가 무엇인지는 아직 나도 모르네. 하지만 알아보려는 마음 자체는 나쁜 것이 아닐 걸세.')];
});
DATA.addDialog('hg1',()=>Q.stage('o6')>=0?[sp('대족장님은 안에 계시오. 들어가시오, 이안.')]:[sp('대족장님의 거처다. 지금은 아무도 들일 수 없다.'),sp('마을의 일을 먼저 해결하고 오시오. 그러면 대족장님이 직접 부르실 거요.')]);
DATA.addDialog('hg2',()=>Q.stage('o6')>=0?[sp('(수호병이 고개를 끄덕이며 길을 비켜 준다.)')]:[sp('……이 문은 오크의 약속을 지키는 곳이오.'),sp('외부인이 이 문 안에 들어간 적은 아직 없소.')]);
DATA.addDialog('ogu',()=>{
 return lines([OG('어머, 멘지에서 온 작은 손님이구나. 이마에 열이 올랐네.'),OG('앉아서 수프 한 그릇 먹고 가. 화덕 곁이 제일 시원한 자리란다.'),OG('우리는 화덕에 불씨를 나눠 가며 산단다. 한 집의 불이 꺼지면 이웃이 불씨를 건네주지. 그게 우리의 약속이야.',()=>{S.hp=S.maxHp;UI.setHP();UI.toast('체력이 모두 회복되었다.','item');setf('lore_fire');}),OG('자, 이제 기운 좀 났어?')]);
});
DATA.addDialog('hasha',()=>[HS('오크 요리는 간단해. 센 불에 오래 굽거나, 약한 불에 오래 끓이는 거야. 그게 전부지.'),HS('용암 화덕은 불 조절이 안 돼서 쓰기가 어려워. 그래서 우리는 불씨를 옮겨 쓴단다. 화덕마다 불이 다르지.'),HS('멘지 요리는 어떻니? 향기가 난다던데. 한 번 먹어 보고 싶네.')]);
DATA.addDialog('brok',()=>[BR('이 집은 열 명이 지었어. 오크 집은 한 사람이 짓는 게 아니거든. 열이 지으면 백이 지켜.'),BR('힘이 세다고 혼자 지으려는 놈은 서까래 하나 못 올려. 오크의 힘은 나누라고 있는 거야.'),BR('……너는 작아서 부럽다. 들어가기 쉽잖아. 지붕 위까지도.')]);
DATA.addDialog('urgo',()=>[UG('순찰 중이다. 협곡에서 마을까지 한 바퀴 도는 데 한 시간이 걸리지.'),UG('요즘은 열기가 센 날이 많아서 순찰이 늘었다. 멘지 손님, 물은 챙겼나?'),UG('불이 큰 날엔 마을 아이들을 광장 안쪽으로 모은다. 그것도 순찰병의 일이다.')]);
})();

<script>
/* ===== 멘지 조정: 서브 퀘스트 정리 / 축제 종료 / NPC 이동 ===== */
(()=>{
const P2=window.P2;
const choice=(text,opts)=>({who:'',text,choices:opts});
const KEY=['ora','roc','sena','hena','kai'];            /* 주요 퀘스트 NPC는 제자리 */
const WANDER={mina:4,tori:8,baro:6,dun:7,fin:6,bel:5,lumi:8,echo:5};

/* ---------- 1. 서브 퀘스트 2개 삭제, 1개는 메인 퀘스트와 연결 ---------- */
['tori_doll','mina_pie'].forEach(id=>{delete DATA.quests[id];DATA.order.quests=DATA.order.quests.filter(q=>q!==id);});
DATA.quests.main1.stages[4].text=()=>'북쪽 숲의 막힌 물길을 찾아 파내자 (삽 필요)'+(Q.done('sena_mushroom')?'':' — 세나의 가시 연고가 있으면 편하다');
Object.assign(DATA.quests.sena_mushroom,{title:'세나의 가시 연고',
 desc:'막힌 물길이 있는 북쪽 숲에는 가시덤불이 가득하다. 세나가 푸른 버섯으로 가시 연고를 만들어 주겠다고 한다.',
 onComplete(){addTrust(2);setf('thorn_ward');UI.toast('가시 연고 효과: 가시덤불 피해가 절반으로 줄었다.','item');}});

const sena0=DATA.dialogs.sena;
DATA.dialogs.sena=(n)=>{
 const st=Q.stage('main1');
 if(Q.stage('sena_mushroom')===-1&&st>=2&&st<999)return[
  sp('샘 일을 도울 거면 북쪽 숲의 막힌 물길까지 가야 하지? 거긴 가시덤불이 빽빽해서 다들 꺼리는 곳이야.'),
  {text:'푸른 버섯이 있으면 가시 연고를 만들어 줄 수 있어. 두 개만 구해 줄래?',choices:[
   {text:'기꺼이요. 어떤 버섯이죠?',lines:[sp('그늘진 숲에서 은은하게 푸르게 빛나는 버섯이야. 가시덤불 근처에 자라니까 조심하고.',()=>Q.start('sena_mushroom'))]},
   {text:'일단 물길부터 확인해 볼게요.',lines:[sp('그래, 마음 바뀌면 언제든 와. 연고가 있으면 훨씬 수월할 거야.')]}]}];
 if(Q.stage('sena_mushroom')===1)return lines([
  sp('와, 정말 가져왔구나! 이 빛깔 좀 봐. 최고급이야.'),
  sp('잠깐만 기다려. 으깨서 약초랑 섞으면…… 자, 가시 연고 완성! 바르고 가면 가시덤불에 긁혀도 덜 아플 거야.'),
  sp('약차도 달여 놨어. 가져가. 허브도 챙기고.')],()=>{take('blue_mushroom',2);give('sena_tea');give('herb',3);Q.complete('sena_mushroom');});
 if(Q.stage('sena_mushroom')===0)return[sp('푸른 버섯은 숲의 그늘진 곳에서 자라. 두 개만 부탁해. 연고가 있어야 물길까지 안전하게 갈 수 있어. (가시덤불 조심!)')];
 return sena0(n);
};

/* ---------- 2. 미나/토리 대사 교체 (파이·인형 퀘스트 제거) ---------- */
DATA.dialogs.mina=()=>{
 const L=[];
 if(!flag('mina_bread')&&Q.stage('main1')>=1){L.push(sp('어머, 처음 보는 얼굴이네! 새로 온 손님이구나? 환영의 뜻으로 빵 하나 줄게.',()=>{setf('mina_bread');give('bread');}));}
 else if(!flag('mina_bread'))return[sp('어서 와요! 빵집은 여기예요. 천천히 둘러보세요.'),sp('아, 소문의 그 외지 손님이시군요. 촌장님과 얘기가 끝나면 또 오세요.')];
 if(flag('west_open')&&!flag('p2_bread'))return lines([sp('서쪽 길로 간다면서요? 빵이 식으면 맛없으니 오늘 갓 구운 걸 드릴게요.'),sp('멀리 가도 우리 가게는 여기 있으니까요. 꼭 돌아오세요!',()=>{give('bread',2);setf('p2_bread');})]);
 if(flag('epilogue_done')&&!flag('festival_over'))return L.concat([sp('오늘 밤에는 빵을 마음껏 내놓을게요! 이안 씨 덕분이에요.')]);
 if(flag('festival_over'))return L.concat([sp('어젯밤 잔치 덕에 밀가루가 바닥났지 뭐예요. 그래도 기분은 최고예요!'),sp('빵이 필요하면 언제든 와요. 이안 씨 몫은 항상 따로 챙겨 둘게요.')]);
 return L.concat([sp('샘이 마르니 반죽에 쓸 물도 아껴야 해서 걱정이에요. 그래도 빵집은 문을 열어 둔답니다.')]);
};
DATA.dialogs.tori=()=>{
 if(flag('epilogue_done')&&!flag('festival_over'))return[sp('형! 오늘 별 진짜 많이 떴어! 저기 저 별 보여?')];
 if(flag('festival_over'))return[sp('어제 잔치 진짜 재밌었지! 오늘은 숲 어귀에서 반딧불이 찾기 놀이할 거야.'),sp('형도 같이 갈래? 아, 가시덤불 근처는 가면 안 돼. 세나 누나한테 혼나!')];
 return[sp('형은 어디서 왔어? 바다 밑에서? 에이, 거짓말!'),sp('근데 형 머리카락에서 짠 내 나는 건 진짜야. 헤헤.')];
};
/* ---------- 3. 축제 다음 날 대사 ---------- */
const MORNING={
 roc:[sp('이안, 어젯밤은 즐거웠나? ……나도 조금은 웃었던 것 같군.'),sp('하지만 오늘부터는 다시 경비 시간이다. 문 앞은 여전히 내가 지킨다.')],
 baro:[sp('어젯밤엔 낚싯대 없이 마셨더니 아침에 머리가 무겁군. 이제 슬슬 물고기 잡으러 나가야지.')],
 dun:[sp('샘이 돌아와서 오늘 아침 밭에 물을 댔어. 올해 수확은 괜찮을 것 같아.')],
 fin:[sp('어젯밤 이야기는 다음 장터에서 써먹어야겠어. 멋진 이야기는 신선할 때 팔아야 하거든.')],
 bel:[sp('잔치 뒤의 아침 공기도 참 좋아. 오래 살아 보니 이런 평온한 아침이 가장 귀한 거라오.')],
 echo:[sp('숲이 아침 햇살에 반짝이고 있네. 어젯밤 별빛을 아직 기억하는 모양이야.')],
 lumi:[sp('어젯밤 노래 잘 들었어! 아침에도 내 피부는 은은하게 빛나지? ……햇빛에선 잘 안 보이려나?')]
};
for(const id in MORNING){const old=DATA.dialogs[id];
 DATA.dialogs[id]=(n)=>{if(flag('festival_over')&&!(id==='roc'&&(flag('west_open')||flag('part2_done'))))return MORNING[id];return old(n);};}

/* ---------- 4. 마을 맵: 이벤트 오브젝트 정리, NPC 이동 ---------- */
const _vm2=DATA.maps.village;
DATA.maps.village=()=>{
 const m=_vm2();
 m.acts=m.acts.filter(a=>!/^apple\d$/.test(a.id));
 m.pickups=m.pickups.filter(k=>k.id!=='wdoll');
 const sb=m.acts.find(a=>a.id==='sign_bakery');if(sb)sb.act=()=>note(['[ 미나의 빵집 ] "갓 구운 빵 있어요. 오늘도 영업합니다."']);
 const bd=m.acts.find(a=>a.id==='board');
 if(bd&&flag('festival_over'))bd.act=()=>note(['[ 마을 소식 ]','"어젯밤 잔치에 와 주신 모든 분께 감사드립니다. 샘은 오늘도 맑게 흐릅니다. — 촌장 오라"']);
 const party=flag('epilogue_done')&&!flag('festival_over');
 for(const n of m.npcs){
  if(KEY.includes(n.id))continue;
  const w=WANDER[n.id];if(!w)continue;
  n.wander=party?Math.min(w,2):w;
 }
 return m;
};

/* ---------- 5. 축제 끝내기 ---------- */
P2.festivalEnd=async()=>{
 if(flag('festival_over'))return;
 Game.cut=true;
 await UI.fade(1,1400);
 await Dlg.say('',[nar('잔치는 밤늦도록 이어졌다. 노랫소리가 잦아들고, 등불이 하나둘 꺼질 때까지.'),nar('물소리를 자장가 삼아 마을은 오랜만에 깊은 잠에 빠졌다.')]);
 setf('festival_over');S.dusk=0;
 /* 마을 사람들을 낮의 자리로 되돌린다 */
 const m=Game.map;
 if(m&&m.id==='village'){
  const day=DATA.maps.village();
  for(const n of m.npcs){const d=day.npcs.find(x=>x.id===n.id);if(!d)continue;
   n.x=d.x;n.y=d.y;n.hx=d.hx;n.hy=d.hy;n.wander=d.wander;n.dir=d.dir;n.path=null;n.target=null;n.moving=false;n.talking=false;}
  const bd=m.acts.find(a=>a.id==='board');if(bd)bd.act=()=>note(['[ 마을 소식 ]','"어젯밤 잔치에 와 주신 모든 분께 감사드립니다. 샘은 오늘도 맑게 흐릅니다. — 촌장 오라"']);
 }
 UI.refreshQuest();
 await sleep(400);await UI.fade(0,1800);
 try{checkQuestItems();}catch(e){}
 await Dlg.say('',[nar('이튿날 아침. 샘 위로 맑은 햇살이 부서졌다.'),nar('마을은 다시 평소의 일상으로 돌아갔다. 오늘은 또 어떤 하루가 될까.')]);
 Save.write();
};
/* ---------- 6. 축제 중: 오라에게서 선택 / 퀘스트 차단 ---------- */
const on=()=>flag('epilogue_done')&&!flag('festival_over');
P2.festivalOn=on;
const EVENTS=[
 [nar('오라가 손뼉을 치자 마을 사람들이 광장 가운데로 모여들었다. 로크마저 어색하게 발을 구른다.'),sp('자, 이안도 함께 춰요! 박자는 틀려도 괜찮아요.')],
 [nar('벨 할아버지가 오래된 노래를 불렀다. 아이들은 손뼉을 치며 따라 불렀고, 샘물은 그 박자에 맞춰 반짝였다.'),sp('이 노래를 들은 게 몇 해 만인지 몰라요. 샘이 돌아온 덕분이에요.')],
 [nar('토리가 횃불을 든 채 광장을 빙글빙글 뛰어다녔다. 불똥이 별처럼 흩어진다.'),sp('토리! 불은 조심해야지! ……후후, 오늘만은 봐줄게요.')],
 [nar('미나가 갓 구운 빵을 한가득 내왔다. 고소한 냄새가 광장을 가득 채운다.'),sp('많이 먹어요, 이안. 오늘은 배부르게 웃는 날이니까요.')],
 [nar('하늘엔 별이 가득하고, 광장엔 웃음소리가 가득하다. 이런 밤이 오래도록 이어졌으면 좋겠다는 생각이 든다.'),sp('……좋은 밤이죠? 이 순간을 오래 기억해 둬요.')]
];
let sleepReq=false;
const oraOld=DATA.dialogs.ora;
DATA.dialogs.ora=(n)=>{
 if(!on())return oraOld(n);
 const k=(S.flags.fest_n||0);
 return lines([
  sp(k===0?'이안! 오늘 밤은 정말 즐거워요. 샘이 돌아온 걸 이렇게 마을 사람들과 함께 기뻐할 수 있다니.':'어머, 이안. 축제는 어때요? 아직 밤은 길어요.'),
  choice('어떻게 할까?',[
   {text:'축제를 더 즐긴다',act:()=>{S.flags.fest_n=k+1;},lines:[...EVENTS[k%EVENTS.length],nar('기운이 솟는 것 같다. 몸이 가벼워졌다.')]},
   {text:'그만 자러 간다',act:()=>{sleepReq=true;},lines:[sp('그래요, 오늘은 정말 좋은 하루였어요. 푹 쉬고 내일 아침에 또 이야기해요.')]}])
 ],()=>{
  if(sleepReq){sleepReq=false;setTimeout(()=>P2.festivalEnd().then(()=>{Game.cut=false;}),80);}
  else{S.hp=S.maxHp;UI.setHP();UI.toast('축제를 즐겼다. 기운이 되살아났다.','item');UI.refreshQuest&&UI.refreshQuest();}
 });
};
/* 축제 중에는 퀘스트 관련 대화·진행 불가 */
const BUSY={
 sena:'오늘은 일 얘기는 접어 두자. 약초도 쉬는 날이 있는 법이야. 내일 아침에 다시 얘기하자.',
 kai:'어이, 오늘은 삽도 쉬는 날이야. 일은 내일 하고 지금은 즐기라고!',
 hena:'……오늘은 샘 돌보는 일도 쉬겠어. 그냥 이 소리를 듣고 싶어서.',
 roc:'오늘은 경비도 쉰다. 아니, 쉬는 척한다. 부탁이라면 내일 아침에 말해라.'};
for(const id in BUSY){const old=DATA.dialogs[id];DATA.dialogs[id]=(n)=>on()?[sp(BUSY[id]),nar('(축제 중에는 의뢰를 진행할 수 없다. 오라에게 말을 걸어 축제를 마치자.)')]:old(n);}
const _cq2=checkQuestItems;checkQuestItems=function(){if(on())return;_cq2();};
const _rq2=UI.refreshQuest;
UI.refreshQuest=function(){const r=_rq2.apply(this,arguments);
 if(on()){const q=document.getElementById('quest');if(q)q.innerHTML='<h4>축제의 밤</h4><div class="ms">마을 사람들과 축제를 즐기는 중이다.<br>마치려면 촌장 오라에게 말을 걸자.</div>';
  const n=document.querySelector('#qHead .qn');if(n)n.textContent='축제의 밤';}
 return r;};
})();

</script>

/* 장착 무기·방어구·훈련 보상·대장간 강화 합산 능력치 계산 (방어구 생명력은 %로 적용) */
const getEquipStats=()=>{
 let wId=S.equipWeapon;
 if(wId&&!Inv.has(wId))wId=null;
 if(wId===undefined){
  if(Inv.has('bonyeom'))wId='bonyeom';
  else if(Inv.has('shovel'))wId='shovel';
  else wId=null;
  S.equipWeapon=wId;
 }
 let aId=S.equipArmor;
 if(aId&&!Inv.has(aId))aId=null;
 if(aId===undefined){
  for(const k of['iron_charm','heat_bracelet','menji_pendant','tori_charm','tunic_armor','diver_armor']){if(Inv.has(k)){aId=k;break;}}
  S.equipArmor=aId||null;
 }
 const wd=wId&&DATA.items[wId]&&DATA.items[wId].weapon?DATA.items[wId]:null;
 const ad=aId&&DATA.items[aId]&&DATA.items[aId].armor?DATA.items[aId]:null;
 const enh=wId?(S.weaponEnhanceBonus||0):0;
 const baseAtkB=S.baseAtkBonus||0;
 const baseDefB=S.baseDefBonus||0;
 const aAtk=ad&&ad.armor.atk?ad.armor.atk:0;
 const aDef=ad&&ad.armor.def?ad.armor.def:0;
 const hpPct=ad&&ad.armor.hpPct?ad.armor.hpPct:0;

 /* 생명력 % 보너스 반영 */
 const baseMax=S.baseMaxHp||100;
 const calcMaxHp=Math.round(baseMax*(1+hpPct/100));
 if(S.maxHp!==calcMaxHp){
  const ratio=S.maxHp>0?(S.hp/S.maxHp):1;
  S.maxHp=calcMaxHp;
  S.hp=Math.min(S.maxHp,Math.max(1,Math.round(S.maxHp*ratio)));
 }

 const totalAtk=(wd?wd.weapon.atk:3)+enh+baseAtkB+aAtk;
 const totalDef=baseDefB+aDef;
 const wObj=wd?{id:wId,name:wd.name+(enh?` (+${enh})`:''),baseAtk:wd.weapon.atk,enh,atk:totalAtk,onHit:wd.weapon.onHit}:{id:null,name:'맨손',baseAtk:3,enh:0,atk:totalAtk};
 const aObj=ad?{id:aId,name:ad.name,def:aDef,atk:aAtk,hpPct}:{id:null,name:'미장착',def:0,atk:0,hpPct:0};
 return{weapon:wObj,armor:aObj,atk:totalAtk,def:totalDef,hpPct,baseAtkB,baseDefB,enh,critRate:0.05,critMult:1.5};
};
const wpn=()=>getEquipStats().weapon;
const log=(t,o)=>{const l=$q('.log');const d=document.createElement('div');if(o)d.className='o';d.textContent=t;l.appendChild(d);while(l.children.length>6)l.removeChild(l.firstChild);};
const float=(node,txt,cls)=>{const d=document.createElement('div');d.className='dmg '+(cls||'');d.textContent=txt;node.appendChild(d);setTimeout(()=>d.remove(),1000);};
const refreshMe=()=>{
 getEquipStats();
 const pct=Math.max(0,Math.min(100,S.hp/S.maxHp*100));
 $q('.me .bar i').style.width=pct+'%';
 const bTxt=st&&st.playerBurn?` 🔥발화(${st.playerBurn.turns}턴)`:'';
 const pTxt=flag('lizard_ally')?(st&&st.petBurn?` · 🦎동료(🔥${st.petBurn.turns}턴)`:' · 🦎동료 도마뱀'):'';
 $q('.me small').textContent=`이안 HP ${Math.ceil(S.hp)}/${S.maxHp}${st&&st.guard?' 🛡방어':''}${bTxt}${pTxt}`;
 UI.setHP&&UI.setHP();
};
const refreshFoe=(e)=>{
 e.node.querySelector('.eh i').style.width=Math.max(0,e.hp/e.max*100)+'%';
 const passTxt=e.fireImmune?'🛡화염저항(발화무시) ':'';
 const brnTxt=e.burn?`🔥발화 ${e.burn.turns}턴`:'';
 e.node.querySelector('.st').textContent=passTxt+brnTxt;
};
const alive=()=>st.foes.filter(e=>e.hp>0);
const shake=()=>{const s=$q('.scene');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');};

const ask=(opts,prompt)=>new Promise(res=>{
 const cmd=$q('.cmd');cmd.innerHTML='';let sel=0;const btns=[];
 const mark=()=>btns.forEach((b,i)=>b.classList.toggle('sel',i===sel&&!b.disabled));
 opts.forEach((o,i)=>{const b=document.createElement('button');b.className='c'+(o.wide?' wide':'');b.innerHTML=o.label;b.disabled=!!o.off;b.dataset.cmd=o.id;
  if(o.wide)b.style.gridColumn='1/3';
  b.onclick=()=>fin(i);b.onmouseenter=()=>{if(!b.disabled){sel=i;mark();}};cmd.appendChild(b);btns.push(b);});
 const fin=i=>{if(opts[i].off)return;cleanup();res(opts[i].id);};
 const kd=e=>{
  const k=e.code;let h=true;
  if(k==='ArrowRight'||k==='KeyD'||k==='ArrowDown'||k==='KeyS'){do{sel=(sel+1)%btns.length;}while(btns[sel].disabled);}
  else if(k==='ArrowLeft'||k==='KeyA'||k==='ArrowUp'||k==='KeyW'){do{sel=(sel+btns.length-1)%btns.length;}while(btns[sel].disabled);}
  else if(k==='Enter'||k==='Space'||k==='KeyE')fin(sel);
  else if(k==='Escape'){const bi=opts.findIndex(o=>o.id==='back');if(bi>=0)fin(bi);}
  else if(/^Digit[1-9]$/.test(k)){const i=+k.slice(5)-1;if(i<btns.length)fin(i);}
  else h=false;
  if(h){e.preventDefault();mark();}
 };
 const cleanup=()=>{removeEventListener('keydown',kd,true);};
 addEventListener('keydown',kd,true);
 while(btns[sel]&&btns[sel].disabled)sel++;mark();
 if(prompt)log(prompt,true);
});

const pickFoe=()=>new Promise(res=>{
 const fs=alive();if(fs.length===1)return res(fs[0]);
 let i=0;const mark=()=>fs.forEach((f,k)=>f.node.classList.toggle('target',k===i));
 fs.forEach(f=>f.node.classList.add('pick'));
 const cmd=$q('.cmd');cmd.innerHTML='<div style="grid-column:1/3;font-size:14px;color:#ffd77a;align-self:center;text-align:center">공격할 대상을 고르세요<br><small style="color:#a9a58f">←→ 선택 · Enter 확인 · Esc 취소</small></div>';
 const done=v=>{removeEventListener('keydown',kd,true);fs.forEach(f=>{f.node.classList.remove('target','pick');f.node.onclick=null;});res(v);};
 const kd=e=>{const k=e.code;let h=true;
  if(k==='ArrowRight'||k==='KeyD'){i=(i+1)%fs.length;}else if(k==='ArrowLeft'||k==='KeyA'){i=(i+fs.length-1)%fs.length;}
  else if(k==='Enter'||k==='Space'||k==='KeyE')done(fs[i]);else if(k==='Escape')done(null);else h=false;
  if(h){e.preventDefault();mark();}};
 fs.forEach((f,k)=>f.node.onclick=()=>done(f));
 addEventListener('keydown',kd,true);mark();
});

const dealToFoe=async(e,dmg,cls)=>{
 e.hp=Math.max(0,e.hp-dmg);float(e.node,'-'+dmg,cls);e.node.classList.remove('hit');void e.node.offsetWidth;e.node.classList.add('hit');refreshFoe(e);
 if(e.hp<=0){log(`${e.name}은(는) 쓰러졌다!`);e.node.classList.add('dead');e.burn=null;refreshFoe(e);}
};

/* 전투 피해 공식: 고정 대미지(isFixed)가 아니라면 (총 피해량) - (방어력) 만큼 받음 */
const hurtMe=async(rawDmg,isFixed=false)=>{
 const def=getEquipStats().def||0;
 let dmg=isFixed?Math.round(rawDmg):Math.max(0,Math.round(rawDmg)-def);
 if(!isFixed&&st.guard)dmg=Math.round(dmg*.5);
 S.hp=Math.max(0,S.hp-dmg);SFX.play('hurt');shake();float($q('.scene'),'-'+dmg,isFixed?'b':'p');refreshMe();return dmg;
};

const playerTurn=async()=>{
 for(;;){
  const w=wpn();
  const act=await ask([{id:'atk',label:`⚔ 공격 <small>${w.name}</small>`},{id:'def',label:'🛡 방어'},{id:'item',label:'🎒 아이템'},{id:'flee',label:'🏃 도망',off:!st.cfg.canFlee}],'어떻게 할까?');
  if(act==='atk'){
   const t=await pickFoe();if(!t)continue;
   let d=Math.max(1,Math.round(w.atk*(0.9+Math.random()*0.2)));let cls='';
   const eq=getEquipStats();
   if(Math.random()<eq.critRate){d=Math.round(d*eq.critMult);cls='c';log('💥 치명타 적중! (치명타 대미지 +50%)');}
   SFX.play('dig');log(`이안의 ${w.name} 공격! ${t.name}에게 ${d}의 피해.`);await dealToFoe(t,d,cls);
   if(w.onHit&&w.onHit.status==='burn'&&t.hp>0){
    if(t.fireImmune){
     log(`🛡 ${t.name}은(는) [화염 저항] 패시브로 발화 효과를 무시했다!`);
    }else if(Math.random()<w.onHit.chance){
     t.burn={turns:w.onHit.turns,dmg:w.onHit.damage};
     log(`🔥 ${t.name}에게 불이 붙었다! (${w.onHit.turns}턴, 매 턴 ${w.onHit.damage} 고정 피해)`);
     refreshFoe(t);
    }
   }
   await sleep(450);return;
  }
  if(act==='def'){st.guard=true;log('이안은 자세를 낮추고 방어 태세를 취했다. (이번 턴 받는 피해 절반)');refreshMe();await sleep(350);return;}
  if(act==='item'){
   const its=Object.keys(S.inv).filter(id=>S.inv[id]>0&&DATA.items[id]&&DATA.items[id].use&&['herb','bread','sena_tea','travel_pack','orc_jerky','fire_fruit','star_pie'].includes(id));
   if(!its.length){log('쓸 수 있는 회복 아이템이 없다.',true);continue;}
   const o=its.map(id=>({id,label:`${DATA.items[id].name} <small>×${S.inv[id]}</small>`}));o.push({id:'back',label:'← 돌아가기',wide:true});
   const pick=await ask(o);if(pick==='back')continue;
   const before=S.hp;DATA.items[pick].use();take(pick);const gain=Math.round(S.hp-before);
   log(`${DATA.items[pick].name}을(를) 사용했다. HP ${gain} 회복.`);float($q('.scene'),'+'+gain,'h');refreshMe();SFX.play('pick');await sleep(400);return;
  }
  if(act==='flee'){
   if(Math.random()<.6){log('재빨리 도망쳤다!');st.fled=true;return;}
   log('도망치려 했지만 적이 길을 막았다!');await sleep(450);return;
  }
 }
};

const foeAct=async(e)=>{

 const def=getEquipStats().def||0;

  if(e.turn%3===0&&Math.random()<.5){const raw=Math.round(e.atk*.6);const d=await hurtMe(raw,false);log(`${e.name}이(가) 흙을 끼얹었다! ${d}의 피해.`);await sleep(450);return;}
  const raw=Math.round(e.atk*(0.9+Math.random()*0.2));const d=await hurtMe(raw,false);log(`${e.name}의 발톱 할퀴기! 이안은 ${d}의 피해를 입었다.`);await sleep(450);return;

const burnTick=async()=>{
 for(const e of alive()){if(!e.burn)continue;
  log(`🔥 ${e.name}이(가) 불길에 휩싸여 ${e.burn.dmg}의 고정 피해를 입었다.`);await dealToFoe(e,e.burn.dmg,'b');
  e.burn.turns--;if(e.burn.turns<=0){e.burn=null;if(e.hp>0)log(`${e.name}의 불이 꺼졌다.`);}refreshFoe(e);await sleep(400);}
 if(st.playerBurn&&S.hp>0){
  const bd=st.playerBurn.dmg;
  await hurtMe(bd,true);
  log(`🔥 발화 피해! 이안은 ${bd}의 고정 피해를 입었다.`);
  st.playerBurn.turns--;
  if(st.playerBurn.turns<=0){st.playerBurn=null;log('이안 몸에 붙은 불길이 꺼졌다.');}
  refreshMe();
  await sleep(380);
 }
 if(st.petBurn){
  log(`🔥 동료 재도마뱀이 발화로 ${st.petBurn.dmg}의 피해를 입었지만 꿋꿋이 버틴다!`);
  st.petBurn.turns--;
  if(st.petBurn.turns<=0)st.petBurn=null;
  refreshMe();
  await sleep(300);
 }
};

const Battle={
 running:false,
 weapon:wpn,
 async run(cfg){
  if(this.running)return 'cancel';
  this.running=true;
  build();st={cfg,foes:[],guard:false,fled:false,playerBurn:null,petBurn:null,keyBlock:null};
  const prevCut=Game.cut;Game.cut=true;
  const blk=e=>{if(e.code==='Escape'||e.code==='Tab'){e.stopImmediatePropagation();}};addEventListener('keydown',blk,true);
  const locId=cfg.bg||(Game.map&&Game.map.id)||'village';
  drawBattleBg($q('canvas.bgcv'),locId);
  $q('.log').innerHTML='';$q('.tt').textContent=cfg.title||'전투';$q('.result').className='result';
  const fe=$q('.foes');fe.innerHTML='';
  cfg.enemies.forEach((d,i)=>{const e=Object.assign({burn:null,turn:0},d,{max:d.hp});
   const n=document.createElement('div');n.className='foe'+(d.boss?' boss':'');n.innerHTML='<div class="st"></div><div class="nm"></div><div class="eh"><i style="width:100%"></i></div>';
   n.querySelector('.nm').textContent=d.name;
   const cv=d.sprite==='ignil'?ignilSprite():(d.sprite==='dummy'?dummySprite():moleSprite(!!d.boss));
   n.insertBefore(cv,n.firstChild);cv.style.animationDelay=(i*.4)+'s';
   e.node=n;fe.appendChild(n);st.foes.push(e);refreshFoe(e);});
  el.classList.add('on');refreshMe();
  (cfg.intro||[]).forEach(t=>log(t));
  if(flag('lizard_ally'))log('🦎 동료 재도마뱀이 이안의 곁에서 함께 전투에 나선다!');
  await sleep(700);
  let outcome=null;
  while(!outcome){
   st.guard=false;refreshMe();
   await playerTurn();
   if(st.fled){outcome='flee';break;}
   if(!alive().length){outcome='win';break;}
   await allyLizardTurn();
   if(!alive().length){outcome='win';break;}
   for(const e of alive()){await foeAct(e);if(S.hp<=0){outcome='lose';break;}}
   if(outcome)break;
   await burnTick();
   if(S.hp<=0){outcome='lose';break;}
   if(!alive().length){outcome='win';break;}
  }
  const r=$q('.result');r.textContent=outcome==='win'?'승리!':outcome==='lose'?'쓰러졌다…':'도주';r.classList.add('on');
  await sleep(1400);
  el.classList.remove('on');removeEventListener('keydown',blk,true);Game.cut=prevCut;this.running=false;
  if(outcome==='lose')S.hp=Math.max(1,Math.round(S.maxHp*.5));UI.setHP();
  return outcome;
 }
};

/* =====================================================================
   3. CORE KEEPER VISUAL & LIGHTING REMASTER ENGINE
   ---------------------------------------------------------------------
   - Nearest-Neighbor 선명한 픽셀 아트 유지 + 고밀도 재질 텍스처 & 2.5D 절벽/벽면 입체화
   - 오프스크린 라이트맵(Multiply) + 벽면 그림자 차폐(Shadow Casting) + HDR 발광 블룸(Bloom)
   - 광원별 고유 색온도·반경·플리커링(Flickering) + 캐릭터 주변 광원 림라이트 반응
   - 코어키퍼식 투명 수면(바닥 투과 + 플레이어·NPC·광원 실시간 수면 반사) & 용암 주변 지형 주황빛 반사
   - 캐릭터 대기 숨쉬기(Idle Breathing)·이동 발걸음 입자·무기 발광 파티클 & 지역별 안개/미세 파티클
   ===================================================================== */
/* 코어키퍼 스타일 도트 외곽선(Pixel Outline) 및 하이라이트 후처리 유틸 */
const addPixelOutline=(cv,outlineCol='rgba(10,14,26,.82)',hiCol='rgba(255,255,255,.16)')=>{
 const w=cv.width,h=cv.height,g=cv.getContext('2d');
 const id=g.getImageData(0,0,w,h),d=id.data;
 const out=new Uint8ClampedArray(d);
 const aAt=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:d[(y*w+x)*4+3];
 for(let y=0;y<h;y++){
  for(let x=0;x<w;x++){
   const idx=(y*w+x)*4;
   if(d[idx+3]===0){
    if(aAt(x-1,y)>180||aAt(x+1,y)>180||aAt(x,y-1)>180||aAt(x,y+1)>180){
     out[idx]=12;out[idx+1]=16;out[idx+2]=28;out[idx+3]=195;
    }
   }else if(d[idx+3]>200&&aAt(x,y-1)===0&&y<h/2){
    /* 상단 픽셀 미세 림라이트 */
    out[idx]=Math.min(255,d[idx]+22);
    out[idx+1]=Math.min(255,d[idx+1]+22);
    out[idx+2]=Math.min(255,d[idx+2]+22);
   }
  }
 }
 id.data.set(out);
 g.putImageData(id,0,0);
 return cv;
};

/* 캐릭터 스프라이트 시트 생성 시 코어키퍼 스타일 또렷한 외곽선 & 상단 림라이트 자동 적용 */

 R(g,'#3b2313',11,36,10,3);R(g,'#54341e',13,24,6,14);R(g,'#73492b',14,24,3,13);R(g,'#91603a',14,25,1,10);
 const blobs=[[16,18,12],[9,19,8],[23,19,8],[12,12,9],[20,12,9],[16,9,8]];
 blobs.forEach(([x,y,r])=>disc(g,x,y+2,r,pal[0]));
 blobs.forEach(([x,y,r])=>disc(g,x,y,r-1,pal[1]));
 [[14,14,7],[10,16,5],[21,15,5],[16,10,6]].forEach(([x,y,r])=>disc(g,x,y-1,r,pal[2]));
 [[13,9,4],[18,10,3],[9,14,3],[21,13,3]].forEach(([x,y,r])=>disc(g,x,y-1,r,pal[3]));
 for(const [x,y] of [[11,6],[14,5],[18,6],[8,11],[23,11]])R(g,pal[4],x,y,2,1);
 if(pal[5]){

   R(g,pal[5],x,y,3,3);R(g,'#fff6b8',x,y,2,2);R(g,'#ffffff',x,y,1,1);

 }
 addPixelOutline(spr);
};

/* ---------- [2] 실시간 2D 동적 조명 & 그림자 차폐(Shadow Casting) 버퍼 ---------- */
const lightCv=document.createElement('canvas');lightCv.width=VW;lightCv.height=VH;
const lightCtx=lightCv.getContext('2d');lightCtx.imageSmoothingEnabled=false;

/* 타일 기반 레이캐스트 차폐 검사: 광원과 대상 지점 사이에 벽(SOLID_G)이 있으면 그림자 드리움 */
const calcOcclusion=(m,x0,y0,x1,y1)=>{
 const dx=x1-x0,dy=y1-y0,dist=Math.hypot(dx,dy);
 if(dist<18)return 1;
 const steps=Math.min(10,Math.max(3,(dist/14)|0));
 let blocked=0;
 for(let s=1;s<steps;s++){
  const t=s/steps;
  const tx=((x0+dx*t)>>4),ty=((y0+dy*t)>>4);
  const gId=m.get(tx,ty);
  if(gId===G.ROCK||gId===G.BASALT||gId===G.CWALL||gId===G.OWALL){
   blocked+=1;
   if(blocked>=2)return 0.18;
  }
 }
 return blocked?0.48:1.0;
};

/* 광원 프로파일(색온도, 플리커링 속도, 반경) */
const getFlicker=(t,seed,speed=6,amp=0.08)=>{
 return 1+amp*(0.6*Math.sin(t*speed+seed)+0.4*Math.cos(t*(speed*1.63)+seed*2.1));
};

/* ---------- [3] 환경 파티클(동굴 먼지 / 숲 빛망울 / 화산 불티 / 수면 윤슬) ---------- */
const envParticles=[];
(()=>{
 const r=rng(2026);
 for(let i=0;i<24;i++){
  envParticles.push({x:r()*VW,y:r()*VH,sz:1+(r()<.3?1:0),vx:(r()-.5)*8,vy:-4-r()*6,ph:r()*6.28});
 }
})();
const stepPuffs=[]; /* 캐릭터 이동 시 발걸음 먼지/물결 입자 */

/* ---------- [4] 지형 렌더링 리마스터 (2.5D 절벽 단면·수면 반사·용암 주변 주황빛 반사·바람 애니메이션) ---------- */
const _drawGroundBase=Game.drawGround;
Game.drawGround=function(g,m,cam,t){
 _drawGroundBase.call(this,g,m,cam,t);
 const x0=Math.max(0,cam.x>>4),y0=Math.max(0,cam.y>>4),x1=Math.min(m.w-1,(cam.x+VW)>>4),y1=Math.min(m.h-1,(cam.y+VH)>>4);
 const isWall=id=>id===G.ROCK||id===G.BASALT||id===G.CWALL||id===G.OWALL;
 const isRoad=id=>id===G.PATH||id===G.STONE||id===G.COBBLE;
 const isWater=id=>id===G.WATER||id===G.SHALLOW;
 const p=this.player;

 for(let ty=y0;ty<=y1;ty++){
  for(let tx=x0;tx<=x1;tx++){
   const id=m.ground[ty*m.w+tx],px=tx*16-cam.x,py=ty*16-cam.y;
   const h=hash2(tx,ty,17);

   /* 1) 코어키퍼 스타일 2.5D 벽면/절벽 단면(Strata) 및 상단 림 하이라이트 */
   if(isWall(id)){
    const sId=m.get(tx,ty+1);
    if(!isWall(sId)&&sId!==255){
     R(g,'rgba(0,0,0,.42)',px,py+11,16,5);
     R(g,'rgba(255,255,255,.16)',px,py+10,16,1);
     if(h>.65){R(g,id===G.CWALL?'rgba(95,224,224,.35)':'rgba(255,200,120,.2)',px+4,py+13,6,1);}
    }
    const nId=m.get(tx,ty-1);
    if(!isWall(nId)&&nId!==255){
     R(g,'rgba(220,240,255,.18)',px,py,16,1);
    }
   }else{
    /* 벽 아래·옆 바닥의 입체 앰비언트 오클루전(Ambient Occlusion) */
    if(isWall(m.get(tx,ty-1))){
     const sg=g.createLinearGradient(0,py,0,py+8);
     sg.addColorStop(0,'rgba(0,6,18,.42)');
     sg.addColorStop(1,'rgba(0,6,18,0)');
     g.fillStyle=sg;g.fillRect(px,py,16,8);
    }
    if(isWall(m.get(tx-1,ty))){R(g,'rgba(0,6,18,.22)',px,py,3,16);}
    if(isWall(m.get(tx+1,ty))){R(g,'rgba(0,6,18,.22)',px+13,py,3,16);}

    /* 도로(흙길·석판·자갈길) 가장자리 입체 베벨 */
    if(isRoad(id)){
     if(!isRoad(m.get(tx,ty-1))){R(g,'rgba(60,40,20,.26)',px,py,16,1);R(g,'rgba(255,248,225,.22)',px,py+1,16,1);}
     if(!isRoad(m.get(tx,ty+1))){R(g,'rgba(50,32,15,.30)',px,py+15,16,1);}
     if(!isRoad(m.get(tx-1,ty))){R(g,'rgba(60,40,20,.20)',px,py,1,16);}
     if(!isRoad(m.get(tx+1,ty))){R(g,'rgba(60,40,20,.20)',px+15,py,1,16);}
    }

    /* 잔디/숲의 미세한 바람 흔들림 애니메이션 (풍부한 생동감) */
    if((id===G.GRASS||id===G.FOREST)&&h>.72){
     const sway=Math.round(Math.sin(t*2.4+tx*.5+ty*.3));
     const gx=px+3+((h*31)%9|0),gy=py+5+((h*19)%7|0);
     R(g,id===G.FOREST?'#245930':'#3d8834',gx,gy+2,2,1);
     R(g,id===G.FOREST?'#62c476':'#8ef078',gx+sway,gy,1,2);
    }

    /* 2) 용암 인접 타일에 반사되는 뜨거운 주황빛(Lava Bounce Light) */
    if(id!==G.LAVA){
     const nearLava=m.get(tx,ty-1)===G.LAVA||m.get(tx,ty+1)===G.LAVA||m.get(tx-1,ty)===G.LAVA||m.get(tx+1,ty)===G.LAVA;
     if(nearLava){
      const lp=.5+.5*Math.sin(t*4+tx+ty);
      R(g,`rgba(255,110,25,${(.18+.10*lp).toFixed(2)})`,px,py,16,16);
      if(m.get(tx,ty+1)===G.LAVA)R(g,`rgba(255,200,80,${(.35+.2*lp).toFixed(2)})`,px,py+14,16,2);
      if(m.get(tx,ty-1)===G.LAVA)R(g,`rgba(255,200,80,${(.35+.2*lp).toFixed(2)})`,px,py,16,2);
     }
    }
   }

   /* 3) 용암(G.LAVA) 코어키퍼식 고열 발광 코어 & 끓어오르는 기포 애니메이션 */
   if(id===G.LAVA){
    const lp=.5+.5*Math.sin(t*3.5+h*6);
    R(g,`rgba(255,225,110,${(.22+.18*lp).toFixed(2)})`,px+3,py+4,10,8);
    R(g,'#fff6c4',px+5+((Math.floor(t*3+tx))%6),py+6+((ty*3)%4),2,2);
   }

   /* 4) 물(G.WATER / G.SHALLOW) 코어키퍼식 수심 투과 + 플레이어 접근 시 투명한 수중 바닥 & 반사광 */
   if(isWater(id)){
    const wx=tx*16+8,wy=ty*16+8;
    const dist=Math.hypot(wx-p.x,wy-(p.y-4));
    const nearFactor=clamp(1-dist/104,0,1);
    const landN=!isWater(m.get(tx,ty-1))&&m.get(tx,ty-1)!==G.BRIDGE;
    const landS=!isWater(m.get(tx,ty+1))&&m.get(tx,ty+1)!==G.BRIDGE;
    const landW=!isWater(m.get(tx-1,ty))&&m.get(tx-1,ty)!==G.BRIDGE;
    const landE=!isWater(m.get(tx+1,ty))&&m.get(tx+1,ty)!==G.BRIDGE;
    const isShore=landN||landS||landW||landE;

    /* 물가 얕은 수심 투과(청록빛 얕은 물 + 모래톱 림) */
    const rimA=clamp(0.28+nearFactor*0.24,0,0.52).toFixed(2);
    g.fillStyle=`rgba(145,232,252,${rimA})`;
    if(landN)g.fillRect(px,py+1,16,2);
    if(landS)g.fillRect(px,py+13,16,2);
    if(landW)g.fillRect(px+1,py,2,16);
    if(landE)g.fillRect(px+13,py,2,16);

    if(nearFactor>0.05){
     /* 투명하게 비치는 물속 모래톱 조약돌과 일렁이는 수중 햇살(Caustics) */
     const pbx=px+3+((h*9)|0),pby=py+4+(((h*37)%8)|0);
     R(g,`rgba(215,198,145,${(nearFactor*0.42).toFixed(2)})`,pbx,pby,3,2);
     R(g,`rgba(235,252,255,${(nearFactor*0.52).toFixed(2)})`,px+((Math.floor(t*5+tx*3+ty*5))%11),py+3+((tx*7+ty*3)%10),4,1);
    }
   }
  }
 }

 /* 5) 수면 실시간 투영(Water Reflection): 물 위 광원 반사 + 플레이어 & NPC 잔물결 미러링 */
 g.save();
 g.beginPath();
 let hasWaterInView=false;
 for(let ty=y0;ty<=y1;ty++){
  for(let tx=x0;tx<=x1;tx++){
   const id=m.ground[ty*m.w+tx];
   if(id===G.WATER||id===G.SHALLOW){
    g.rect(tx*16-cam.x,ty*16-cam.y,16,16);
    hasWaterInView=true;
   }
  }
 }
 if(hasWaterInView&&(!window.GameCfg||window.GameCfg.waterRefl!==false)){
  g.clip();
  /* 주변 광원(가로등, 수정 등)이 수면에 길게 비치는 물결 반사광 */
  for(const l of m.glows){
   const lx=l.x-cam.x,ly=l.y-cam.y;
   if(lx<-60||lx>VW+60||ly<-60||ly>VH+60)continue;
   const col=l.c||'140,230,255';
   for(let k=0;k<5;k++){
    const ry=ly+8+k*4,rw=Math.max(2,10-k*2)+Math.sin(t*6+k)*2;
    const rx=lx+Math.sin(t*4+k*1.5)*2;
    R(g,`rgba(${col},${(0.32-k*0.05).toFixed(2)})`,Math.round(rx-rw/2),Math.round(ry),Math.round(rw),1);
   }
  }
  /* 플레이어 주변 투명 수중 글로우 + 플레이어 수면 반사 */
  const prx=Math.round(p.x-cam.x),pry=Math.round(p.y-cam.y);
  const wg=g.createRadialGradient(prx,pry+6,2,prx,pry+6,56);
  wg.addColorStop(0,'rgba(195,252,255,.36)');
  wg.addColorStop(.55,'rgba(115,225,250,.16)');
  wg.addColorStop(1,'rgba(70,180,235,0)');
  g.fillStyle=wg;g.fillRect(prx-56,pry-50,112,112);

  const sh=Sprites.charSheet(PLAYER_PAL[S.outfit]||PLAYER_PAL.tunic);
  const fr=p.moving?1+(Math.floor(p.anim)%2):0;
  const spr=sh[p.dir][fr];
  if(spr){
   g.save();
   g.globalAlpha=0.45;
   for(let sy=0;sy<20;sy+=2){
    const ripple=Math.sin(t*5.5+sy*.45)*1.25;
    g.drawImage(spr,0,sy,16,2,Math.round(prx-8+ripple),pry+1+(19-sy),16,2);
   }
   const rw=7+Math.sin(t*4)*2;
   g.strokeStyle='rgba(230,252,255,.6)';g.lineWidth=1;
   g.strokeRect(Math.round(prx-rw),pry+2,Math.round(rw*2),2);
   g.restore();
  }
  /* 물가 NPC 수면 반사 */
  for(const n of m.npcs){
   if(Math.hypot(n.x-p.x,n.y-p.y)>140)continue;
   const nsh=Sprites.charSheet(n.pal),nfr=n.moving?1+(Math.floor(n.anim)%2):0,nspr=nsh[n.dir][nfr];
   if(!nspr)continue;
   const nrx=Math.round(n.x-cam.x),nry=Math.round(n.y-cam.y),sc=n.scale||1;
   g.save();g.globalAlpha=0.35;g.translate(nrx,nry+2+19*sc);g.scale(1,-1);
   g.drawImage(nspr,-8*sc,0,16*sc,20*sc);g.restore();
  }
 }
 g.restore();
};

/* ---------- [5] 캐릭터·NPC 애니메이션(대기 숨쉬기·발걸음 먼지) & 광원 림라이트 반응 ---------- */
const findNearestLight=(m,wx,wy)=>{
 let best=null,bestD=140;
 for(const l of m.glows){
  const d=Math.hypot(l.x-wx,l.y-wy);
  if(d<bestD){bestD=d;best=l;}
 }
 return best?{l:best,d:bestD}:null;
};

Game.drawPlayer=function(g,cam,t){
 const p=this.player,m=this.map,sea=m.theme==='sea';
 const sh=Sprites.charSheet(PLAYER_PAL[S.outfit]||PLAYER_PAL.tunic);
 const fr=p.moving?1+(Math.floor(p.anim)%2):0;
 const x=Math.round(p.x-cam.x),y=Math.round(p.y-cam.y);

 /* 이동 중 발걸음 먼지/물결 파티클 생성 */
 if(p.moving&&Math.random()<0.28){
  const tid=m.get(p.x>>4,(p.y-2)>>4);
  const col=(tid===G.WATER||tid===G.SHALLOW)?'#bfefff':(m.theme==='orc'?'#ff9a52':'#e8dcc4');
  stepPuffs.push({x:p.x+(Math.random()-.5)*6,y:p.y-1,vx:(Math.random()-.5)*8,vy:-4-Math.random()*6,life:0.45,max:0.45,c:col});
 }
 /* 발걸음 파티클 렌더링 */
 for(let i=stepPuffs.length-1;i>=0;i--){
  const sp=stepPuffs[i];sp.life-=0.016;
  if(sp.life<=0){stepPuffs.splice(i,1);continue;}
  sp.x+=sp.vx*0.016;sp.y+=sp.vy*0.016;
  g.globalAlpha=clamp(sp.life/sp.max,0,0.75);
  R(g,sp.c,Math.round(sp.x-cam.x),Math.round(sp.y-cam.y),2,2);
 }
 g.globalAlpha=1;

 /* 그림자 */
 if(!sea){
  g.fillStyle='rgba(0,4,14,.38)';
  g.beginPath();g.ellipse(x,y-1,6.5,2.8,0,0,6.3);g.fill();
 }

 /* 대기 모션(Idle Breathing) 및 수영 모션 */
 const bob=sea?Math.round(Math.sin(t*2.2)*1.5):0;
 const breath=(!p.moving&&!sea)?(Math.sin(t*3.2)>0.35?1:0):0;
 const spr=sh[p.dir][fr];
 g.drawImage(spr,x-8,y-19+bob+breath,16,20-breath);

 /* 주변 광원에 의한 캐릭터 림라이트(Rim Light) 하이라이트 */
 const nl=findNearestLight(m,p.x,p.y-8);
 const hasFlame=(S.equipWeapon==='bonyeom')||(S.equipWeapon===undefined&&Inv.has('bonyeom'));
 if(nl||hasFlame){
  const lCol=hasFlame?'255,150,50':(nl.l.c||'255,215,130');
  const intensity=hasFlame?0.42:clamp(1-nl.d/120,0,0.38);
  const side=nl?(nl.l.x>p.x?3:-4):(p.dir==='left'?-4:3);
  g.fillStyle=`rgba(${lCol},${intensity.toFixed(2)})`;
  g.fillRect(x+side,y-16+bob,1,11);
 }

 /* 장착 무기 시각 효과 (본염도 불꽃 검신 & 불티 파티클 / 삽) */
 const eqW=S.equipWeapon!==undefined?S.equipWeapon:(Inv.has('bonyeom')?'bonyeom':(Inv.has('shovel')?'shovel':null));
 if(eqW==='bonyeom'){
  const wx=p.dir==='left'?x-7:x+6,wy=y-11+bob;
  R(g,'#ff6a1a',wx,wy-4,2,7);R(g,'#ffd966',wx,wy-3,1,5);
  const sparkY=wy-4-((t*14)%6|0);
  R(g,'#fff2a6',wx+(Math.sin(t*9)>0?1:-1),sparkY,1,1);
 }else if(eqW==='shovel'){
  const wx=p.dir==='left'?x-6:x+5,wy=y-10+bob;
  R(g,'#9a6b3c',wx,wy-3,1,5);R(g,'#c9d3df',wx,wy+1,2,2);
 }
};

const _drawNPCBase=Game.drawNPC;
Game.drawNPC=function(g,n,cam,t){
 const breath=(!n.moving)?(Math.sin(t*2.8+n.x*.1)>0.4?1:0):0;
 const origY=n.y;
 n.y=origY+breath*.5;
 _drawNPCBase.call(this,g,n,cam,t);
 n.y=origY;
 /* NPC 주변 광원 림라이트 반응 */
 const nl=findNearestLight(this.map,n.x,n.y-8);
 if(nl){
  const x=Math.round(n.x-cam.x),y=Math.round(n.y-cam.y),sc=n.scale||1;
  const intensity=clamp(1-nl.d/110,0,0.34);
  const side=nl.l.x>n.x?Math.round(3*sc):Math.round(-4*sc);
  g.fillStyle=`rgba(${nl.l.c||'255,205,120'},${intensity.toFixed(2)})`;
  g.fillRect(x+side,Math.round(y-15*sc),1,Math.round(10*sc));
 }
};

/* 아이템 픽업 오브젝트 발광 링 & 하이라이트 개선 */

/* 동료 재도마뱀(lizard_ally) 오버월드 실시간 추적 및 렌더링 */
const pet={x:0,y:0,dir:'down',map:''};
const _drawPlayerPet=Game.drawPlayer;
Game.drawPlayer=function(g,cam,t){
 if(flag('lizard_ally')&&this.map){
  const p=this.player;
  if(pet.map!==this.map.id||Math.hypot(pet.x-p.x,pet.y-p.y)>120){
