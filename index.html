   pet.y=p.y+(p.dir==='up'?14:p.dir==='down'?-14:4);
  }
  const tx=p.x+(p.dir==='left'?15:p.dir==='right'?-15:-10);
  const ty=p.y+(p.dir==='up'?14:p.dir==='down'?-12:3);
  const dx=tx-pet.x,dy=ty-pet.y,d=Math.hypot(dx,dy);
  if(d>4){
   pet.x+=dx*0.14;pet.y+=dy*0.14;
   pet.dir=dx<0?'left':'right';
  }
  const px=Math.round(pet.x-cam.x),py=Math.round(pet.y-cam.y);
  const k=(Math.sin(t*7)>0)?1:0;
  g.save();
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(px,py-1,5,2,0,0,6.3);g.fill();
  g.translate(px-6,py-9);
  if(pet.dir==='left'){g.translate(12,0);g.scale(-1,1);}
  R(g,'#9a2a1a',2,3,7,3);R(g,'#e04a2a',3,3,5,1);R(g,'#7a1f10',9,3,3,2);
  R(g,'#ffd447',10,3,1,1);R(g,'#ff8a2a',0,4,3,1);
  R(g,'#9a2a1a',3,6+k,1,2);R(g,'#9a2a1a',7,6+(1-k),1,2);
  g.restore();
 }
 _drawPlayerPet.call(this,g,cam,t);
};

/* ---------- [6] 실시간 2D 동적 조명 셰이더(Lightmap + Shadow Casting + Bloom + 안개) ---------- */
const _drawOverlayCore=Game.drawOverlay;
Game.drawOverlay=function(g,m,cam,t){
 /* 오브젝트(나무·건물)의 자연스러운 접지 그림자 */
 g.save();
 for(const o of m.objs){
  const ox=o.x-cam.x,oy=o.y-cam.y;
  if(ox+o.w<-20||ox>VW+20||oy+o.h<-20||oy>VH+20)continue;
  if(o.w>=48&&o.h>=48){
   const sg=g.createLinearGradient(0,oy+o.h-2,0,oy+o.h+5);
   sg.addColorStop(0,'rgba(0,6,18,.34)');sg.addColorStop(1,'rgba(0,6,18,0)');
   g.fillStyle=sg;g.fillRect(ox+2,oy+o.h-2,o.w-4,7);
  }else if(o.kind){
   g.fillStyle='rgba(0,8,18,.24)';
   g.beginPath();g.ellipse(ox+16,oy+o.h-3,10,4,0,0,6.3);g.fill();
  }
 }
 g.restore();

 /* 기본 오버레이(심해 해파리, 저녁 노을, 동굴 어둠 등 기존 연출) 실행 */
 if(Game.amb&&Game.amb.length>12)Game.amb.length=12;
 _drawOverlayCore.call(this,g,m,cam,t);

 const p=this.player,px=p.x-cam.x,py=p.y-cam.y-8;
 const hasFlameSword=(S.equipWeapon==='bonyeom')||(S.equipWeapon===undefined&&Inv.has('bonyeom'));

 /* (1) 지역별 저지대 안개(Atmospheric Ground Mist) 및 원근 깊이감 */
 g.save();
 for(let i=0;i<2;i++){
  const mistY=((i*160+t*6)%VH);
  const mistX=((t*12*(i?1:-1)+i*220)%VW+VW)%VW;
  const mistCol=m.theme==='orc'?'255,140,70':(m.theme==='cave'||m.theme==='sea')?'90,210,245':'200,240,255';
  const mistAlpha=m.theme==='village'&&(S.dusk<=0)?0.035:0.06;
  const mg=g.createRadialGradient(mistX,mistY,10,mistX,mistY,120);
  mg.addColorStop(0,`rgba(${mistCol},${mistAlpha})`);
  mg.addColorStop(1,`rgba(${mistCol},0)`);
  g.fillStyle=mg;g.fillRect(0,0,VW,VH);
 }
 g.restore();

 /* (2) 오프스크린 2D 동적 라이트맵(Multiply): 깊이 있는 어둠 + 광원 차폐 그림자 + 색온도 대비 */
 if(window.GameCfg&&window.GameCfg.dynLight===false)return;
 /* 낮 시간대 멘지 마을은 기존의 화사한 색감을 해치지 않도록 라이트맵 차폐를 아주 부드럽게(94% 밝기) 유지하고,
    동굴/심해/황혼/오크 지역에서는 코어키퍼 특유의 강렬한 명암 대비와 벽면 그림자를 표현 */
 lightCtx.globalCompositeOperation='source-over';
 if(m.theme==='cave'){
  g.restore&&0; return; /* 잊힌 유적에서는 광원 효과 제외 */
 }else if(m.theme==='sea'){
  lightCtx.fillStyle='rgb(85, 115, 160)';
 }else if(m.theme==='orc'){
  lightCtx.fillStyle='rgb(185, 165, 160)';
 }else if(S.dusk>0){
  lightCtx.fillStyle='rgb(95, 110, 165)';
 }else{
  lightCtx.fillStyle='rgb(236, 242, 248)';
 }
 lightCtx.fillRect(0,0,VW,VH);

 /* 라이트맵 위에 각 광원을 벽면 차폐(Shadow Casting)와 플리커링을 반영해 가산 합성 */
 lightCtx.globalCompositeOperation='lighter';
 for(const l of m.glows){
  const lx=l.x-cam.x,ly=l.y-cam.y;
  if(lx<-90||lx>VW+90||ly<-90||ly>VH+90)continue;
  const fl=getFlicker(t,l.x*.37+l.y*.19,5.5,0.09);
  const occ=calcOcclusion(m,l.x,l.y,p.x,p.y-6);
  const r=(l.r||48)*1.18*fl;
  const col=l.c||(m.theme==='orc'?'255,135,45':m.theme==='cave'?'95,230,240':'255,215,130');
  const lg=lightCtx.createRadialGradient(lx,ly,2,lx,ly,r);
  lg.addColorStop(0,`rgba(${col},${(0.85*occ).toFixed(2)})`);
  lg.addColorStop(.5,`rgba(${col},${(0.38*occ).toFixed(2)})`);
  lg.addColorStop(1,`rgba(${col},0)`);
  lightCtx.fillStyle=lg;lightCtx.fillRect(lx-r,ly-r,r*2,r*2);
 }

 /* 플레이어 주변 동적 라이트 (광원 근처에 접근하면 주변 밝기가 자연스럽게 증폭됨) */
 const nearL=findNearestLight(m,p.x,p.y-8);
 const boost=nearL?clamp(1-nearL.d/120,0,0.35):0;
 const pRad=(hasFlameSword?82:62)*(1+boost*.35)*getFlicker(t,1.7,7,hasFlameSword?0.07:0.03);
 const pCol=hasFlameSword?'255,155,60':'235,245,255';
 const plg=lightCtx.createRadialGradient(px,py,4,px,py,pRad);
 plg.addColorStop(0,`rgba(${pCol},0.92)`);
 plg.addColorStop(.5,`rgba(${pCol},0.42)`);
 plg.addColorStop(1,`rgba(${pCol},0)`);
 lightCtx.fillStyle=plg;lightCtx.fillRect(px-pRad,py-pRad,pRad*2,pRad*2);

 /* 완성된 라이트맵을 메인 캔버스에 Multiply 합성 (픽셀 경계는 100% 선명하게 유지) */
 g.save();
 g.globalCompositeOperation='multiply';
 g.drawImage(lightCv,0,0);
 g.restore();

 /* (3) HDR 발광 블룸(Bloom) 패스: 멘지 마을 등의 광원 중심부와 창문이 은은하게 빛나도록 가산 (orc는 기본 오버레이에서 이미 그림) */
 g.save();
 g.globalCompositeOperation='lighter';
 if(m.theme==='village')for(const l of m.glows){
  const lx=l.x-cam.x,ly=l.y-cam.y;
  if(lx<-80||lx>VW+80||ly<-80||ly>VH+80)continue;
  const fl=getFlicker(t,l.x*.5,6,0.1);
  const r=(l.r||46)*fl;
  const col=l.c||(m.theme==='orc'?'255,130,40':m.theme==='cave'?'95,235,245':'255,215,135');
  const bg=g.createRadialGradient(lx,ly,1,lx,ly,r);
  const coreA=(m.theme==='village'&&S.dusk<=0)?0.22:0.36;
  bg.addColorStop(0,`rgba(255,255,245,${coreA})`);
  bg.addColorStop(.3,`rgba(${col},${(coreA*.65).toFixed(2)})`);
  bg.addColorStop(1,`rgba(${col},0)`);
  g.fillStyle=bg;g.fillRect(lx-r,ly-r,r*2,r*2);
 }

 /* 건물 창문에서 퍼지는 따뜻한 불빛 블룸 */
 for(const o of m.objs){
  if(!o.windows)continue;
  for(const w of o.windows){
   const wx=o.x+w.x+w.w/2-cam.x,wy=o.y+w.y+w.h/2-cam.y;
   if(wx<-30||wx>VW+30||wy<-30||wy>VH+30)continue;
   const wr=18+Math.sin(t*3.5+wx)*1.5;
   const wg=g.createRadialGradient(wx,wy,1,wx,wy,wr);
   const wa=(m.theme==='village'&&S.dusk<=0)?0.18:0.34;
   wg.addColorStop(0,`rgba(255,220,130,${wa})`);
   wg.addColorStop(1,'rgba(255,150,50,0)');
   g.fillStyle=wg;g.fillRect(wx-wr,wy-wr,wr*2,wr*2);
  }
 }

 /* 플레이어 무기/랜턴 블룸 */
 const pbR=hasFlameSword?(46+Math.sin(t*8)*3):(28+boost*14);
 const pbg=g.createRadialGradient(px,py,1,px,py,pbR);
 if(hasFlameSword){
  pbg.addColorStop(0,'rgba(255,210,120,.28)');
  pbg.addColorStop(.45,'rgba(255,110,30,.14)');
  pbg.addColorStop(1,'rgba(255,60,0,0)');
 }else{
  pbg.addColorStop(0,`rgba(240,250,255,${(0.12+boost*.18).toFixed(2)})`);
  pbg.addColorStop(1,'rgba(180,225,255,0)');
 }
 g.fillStyle=pbg;g.fillRect(px-pbR,py-pbR,pbR*2,pbR*2);

 /* (4) 바이옴별 절제된 미세 환경 파티클 (동굴 먼지 / 숲 빛망울 / 화산 불티) */
 const pCount=(m.theme==='village'&&S.dusk<=0)?10:18;
 const pColor=m.theme==='orc'?'255,160,65':(m.theme==='cave'||m.theme==='sea')?'130,245,255':'255,245,190';
 for(let i=0;i<pCount;i++){
  const ep=envParticles[i];
  ep.x+=Math.sin(t*1.1+ep.ph)*.15+ep.vx*.014;
  ep.y+=ep.vy*.014*(m.theme==='cave'?0.4:1);
  if(ep.y<-4){ep.y=VH+4;ep.x=Math.random()*VW;}
  if(ep.x<-4)ep.x=VW+4;if(ep.x>VW+4)ep.x=-4;
  const pa=(.25+.35*(.5+.5*Math.sin(t*2.8+ep.ph)))*(m.theme==='village'&&S.dusk<=0?0.65:1);
  g.fillStyle=`rgba(${pColor},${pa.toFixed(2)})`;
  g.fillRect(Math.round(ep.x),Math.round(ep.y),ep.sz,ep.sz);
 }
 g.restore();

 /* (5) 은은하고 자연스러운 비네팅(Subtle Vignette) — 낮에는 아주 옅게, 어두운 곳에서는 깊이감 있게 */
 g.save();
 const vigAlpha=(m.theme==='village'&&S.dusk<=0)?0.14:(m.theme==='cave'?0.38:0.24);
 const vg=g.createRadialGradient(VW/2,VH/2,150,VW/2,VH/2,295);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,`rgba(4,8,20,${vigAlpha})`);
 g.fillStyle=vg;g.fillRect(0,0,VW,VH);
 g.restore();
};
})();
</script>

document.head.appendChild(st);

/* 타이틀 화면 오른쪽 아래 작은 설정 버튼 생성 */
const titleEl=$('title');
const setBtn=document.createElement('button');
setBtn.id='tSetBtn';
setBtn.innerHTML='⚙ 설정 · 개발자';
titleEl.appendChild(setBtn);

modal.className='hidden';
modal.innerHTML=`
 <div id="tSetBox" class="panel">

   <button class="stab on" data-stab="dev">🛠 개발자 탭 (챕터 · 신규 업데이트 바로 시작)</button>

   <button id="tSetClose" title="닫기">✕</button>
  </div>
  <div id="tSetBody"></div>
 </div>
`;

let curStab='dev';

 Game.started=true;
 Game.cut=false;
 Game.loadMap(mapId,tx*16+8,ty*16+14,dir||'down');
 UI.showHUD(true);

 Save.write();
 if(toastMsg)UI.toast(toastMsg,'quest');

const mFoot=$('mFoot'),mHint=mFoot.querySelector('.hint');
if(mFoot&&mHint){
 const bDevInGame=document.createElement('button');
 bDevInGame.id='bDevInGame';
 bDevInGame.textContent='🛠 챕터·설정';
 bDevInGame.onclick=()=>{UI.closePanel();openDevSetModal('dev');};
 mFoot.insertBefore(bDevInGame,mHint);
}
$('tSetClose').onclick=()=>modal.classList.add('hidden');
document.querySelectorAll('#tSetTabs .stab').forEach(b=>{
 b.onclick=()=>{curStab=b.dataset.stab;renderSetModal();};
});

$('tSetBody').addEventListener('click',e=>{
 const pb=e.target.closest('[data-preset]');
 if(pb){
  const key=pb.dataset.preset;
  if(PRESETS[key])PRESETS[key]();
  return;
 }
 const cb=e.target.closest('[data-cfg]');
 if(cb){
  const act=cb.dataset.cfg;
  if(act==='sfx_on'){SFX.on=true;$('bSnd').textContent='🔊';}
  else if(act==='sfx_off'){SFX.on=false;$('bSnd').textContent='🔇';}
  else if(act.startsWith('vol_')){Cfg.vol=parseFloat(act.slice(4));SFX.play('blip');}
  else if(act.startsWith('spd_')){Cfg.textSpeed=parseInt(act.slice(4),10);SFX.play('blip');}
  else if(act==='light_on'){Cfg.dynLight=true;Cfg.waterRefl=true;}
  else if(act==='light_off'){Cfg.dynLight=false;Cfg.waterRefl=false;}
  else if(act==='clear_save'){Save.clear();$('tCont').disabled=true;UI.toast('저장 데이터가 초기화되었습니다.','info');}
  renderSetModal();
 }
});
